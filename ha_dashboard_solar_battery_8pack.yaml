- title: Cell Diagnostics
  path: cells
  icon: mdi:battery-heart-variant
  type: masonry
  badges: []
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-template-card
      primary: ⬅️ กลับสู่หน้าภาพรวมหลัก (Home Energy)
      secondary: แตะเพื่อกลับไปยังหน้าภาพรวมพลังงานและบัญชีสรุปค่าไฟ
      icon: mdi:arrow-left-bold-box
      icon_color: blue
      tap_action:
        action: navigate
        navigation_path: /home-energy
    - type: custom:mushroom-title-card
      title: 🔋 ระบบวิเคราะห์สุขภาพเซลล์แบตเตอรี่ (120-Cell Diagnostics)
      subtitle: รายงานสถานะแรงดันเซลล์สดรายลูก พร้อมตรวจจับจุดดริฟต์ (Δ) เชิงรุก 8
        แพ็ก
    - type: markdown
      content: "{% set p1 = 'sensor.huawei_esm_battery_system_pack_' %}\n{% set p2\
        \ = 'sensor.tcanesm_pack_' %}\n\n### \U0001F4CA สรุปความสมดุลแบตเตอรี่ 8 แพ็ก\
        \ (Huawei ESM-48100B1)\n\n| แพ็ก | แรงดันรวม | กระแส (A) | SOC | ต่ำสุด (Min)\
        \ | สูงสุด (Max) | ดริฟต์ (Δ) | สถานะความสมดุล |\n|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|\n\
        {%- for p in range(1, 9) %}\n{%- set v_ent = p1 ~ p ~ '_battery_voltage' %}\n\
        {%- set v = states(v_ent)|float(-1) %}\n{%- if v < 0 %}{% set v_ent = p2 ~\
        \ p ~ '_battery_voltage' %}{% set v = states(v_ent)|float(0) %}{% endif %}\n\
        {%- set i_ent = p1 ~ p ~ '_current' %}\n{%- set i = states(i_ent)|float(0)\
        \ %}\n{%- if i == 0 %}{% set i_ent = p2 ~ p ~ '_current' %}{% set i = states(i_ent)|float(0)\
        \ %}{% endif %}\n{%- set soc_ent = p1 ~ p ~ '_state_of_charge' %}\n{%- set\
        \ soc = states(soc_ent)|float(-1) %}\n{%- if soc < 0 %}{% set soc_ent = p2\
        \ ~ p ~ '_state_of_charge' %}{% set soc = states(soc_ent)|float(0) %}{% endif\
        \ %}\n{%- set ns = namespace(min_v=999.0, max_v=0.0, min_idx=0, max_idx=0,\
        \ diff=0, cells=[]) %}\n{%- for c in range(1, 16) %}\n  {%- set c_str = '%02d'|format(c)\
        \ %}\n  {%- set c_ent = p1 ~ p ~ '_cell_' ~ c_str ~ '_voltage' %}\n  {%- set\
        \ cv = states(c_ent)|float(-1) %}\n  {%- if cv < 0 %}{% set c_ent = p2 ~ p\
        \ ~ '_cell_' ~ c_str ~ '_voltage' %}{% set cv = states(c_ent)|float(0) %}{%\
        \ endif %}\n  {%- if cv > 0 %}\n    {%- set ns.cells = ns.cells + [cv] %}\n\
        \    {%- if cv < ns.min_v %}{% set ns.min_v = cv %}{% set ns.min_idx = c %}{%\
        \ endif %}\n    {%- if cv > ns.max_v %}{% set ns.max_v = cv %}{% set ns.max_idx\
        \ = c %}{% endif %}\n  {%- endif %}\n{%- endfor %}\n{%- if ns.cells|length\
        \ > 0 %}\n  {%- set ns.diff = ((ns.max_v - ns.min_v) * 1000)|round(0)|int\
        \ %}\n{%- endif %}\n{%- set badge = '\U0001F7E2 สมดุลดีเยี่ยม' %}\n{%- if\
        \ ns.diff >= 30 %}{% set badge = '\U0001F7E1 เฝ้าระวัง' %}{% endif %}\n{%-\
        \ if ns.diff >= 50 or ns.max_v >= 3.580 or (ns.min_v <= 3.000 and ns.min_v\
        \ > 0) %}{% set badge = '\U0001F534 ผิดปกติ' %}{% endif %}\n| **Pack #{{ p\
        \ }}** | {{ '%.2f'|format(v) }} V | {{ '+' if i >= 0 else '' }}{{ '%.1f'|format(i)\
        \ }} A | {{ '%.0f'|format(soc) }}% | {{ '%.3f'|format(ns.min_v) }} V (C{{\
        \ '%02d'|format(ns.min_idx) }}) | {{ '%.3f'|format(ns.max_v) }} V (C{{ '%02d'|format(ns.max_idx)\
        \ }}) | **{{ ns.diff }} mV** | {{ badge }} |\n{%- endfor %}\n"
    - type: markdown
      content: "{% set p1 = 'sensor.huawei_esm_battery_system_pack_' %}\n{% set p2\
        \ = 'sensor.tcanesm_pack_' %}\n{% set pack_names = {\n  1: 'Pack #1 [ลูกที่\
        \ 1 / ID 214]',\n  2: 'Pack #2 [ลูกที่ 2 / ID 215]',\n  3: 'Pack #3 [ลูกที่\
        \ 3 / ID 216]',\n  4: 'Pack #4 [ลูกที่ 4 / บัสแยก ID 214]',\n  5: 'Pack #5\
        \ [ลูกที่ 5 / ID 218]',\n  6: 'Pack #6 [ลูกที่ 6 / ID 219]',\n  7: 'Pack #7\
        \ [ลูกที่ 7 / ID 220]',\n  8: 'Pack #8 [ลูกที่ 8 / บอร์ดบริดจ์ CAN]'\n} %}\n\
        \n### \U0001F52C รายงานวิเคราะห์ 15 เซลล์ แยกรายแพ็ก (15S &times; 8 Packs)\n\
        {% for p in range(1, 9) -%}\n{% set v = states(p1 ~ p ~ '_battery_voltage')|float(states(p2\
        \ ~ p ~ '_battery_voltage')|float(0)) -%}\n{% set i = states(p1 ~ p ~ '_current')|float(states(p2\
        \ ~ p ~ '_current')|float(0)) -%}\n{% set soc = states(p1 ~ p ~ '_state_of_charge')|float(states(p2\
        \ ~ p ~ '_state_of_charge')|float(0)) -%}\n{% set temp = states(p1 ~ p ~ '_max_cell_temperature')|float(states(p2\
        \ ~ p ~ '_max_cell_temperature')|float(0)) -%}\n{% set ns = namespace(min_v=999.0,\
        \ max_v=0.0, min_idx=0, max_idx=0, cells=[]) -%}\n{% for c in range(1, 16)\
        \ -%}\n  {% set c_str = '%02d'|format(c) -%}\n  {% set cv = states(p1 ~ p\
        \ ~ '_cell_' ~ c_str ~ '_voltage')|float(states(p2 ~ p ~ '_cell_' ~ c_str\
        \ ~ '_voltage')|float(0)) -%}\n  {% set ns.cells = ns.cells + [cv] -%}\n \
        \ {% if cv > 0 and cv < ns.min_v %}{% set ns.min_v = cv %}{% set ns.min_idx\
        \ = c %}{% endif -%}\n  {% if cv > ns.max_v %}{% set ns.max_v = cv %}{% set\
        \ ns.max_idx = c %}{% endif -%}\n{% endfor -%}\n{% set diff = ((ns.max_v -\
        \ ns.min_v) * 1000)|round(0)|int if ns.max_v > 0 else 0 -%}\n{% set badge\
        \ = '\U0001F7E2 ดีเยี่ยม' if diff < 30 else ('\U0001F7E1 เฝ้าระวัง' if diff\
        \ < 50 else '\U0001F534 ตรวจสอบ') -%}\n\n#### \U0001F4E6 {{ pack_names[p]\
        \ }}\n> **⚡ แรงดัน:** {{ '%.2f'|format(v) }} V | **กระแส:** {{ '+' if i >=\
        \ 0 else '' }}{{ '%.1f'|format(i) }} A | **SOC:** {{ '%.0f'|format(soc) }}%\
        \ | **อุณหภูมิ:** {{ '%.0f'|format(temp) }}°C | **ดริฟต์:** {{ diff }} mV\
        \ ({{ badge }})\n\n| เซลล์ 01–05 | เซลล์ 06–10 | เซลล์ 11–15 |\n|:---:|:---:|:---:|\n\
        {% for row in range(5) -%}\n  {% set c1 = row + 1 %}{% set c2 = row + 6 %}{%\
        \ set c3 = row + 11 -%}\n  {% set v1 = ns.cells[c1-1] %}{% set v2 = ns.cells[c2-1]\
        \ %}{% set v3 = ns.cells[c3-1] -%}\n  {% set t1 = (' **' ~ '%.3f'|format(v1)\
        \ ~ ' V** \U0001F534' if c1 == ns.min_idx else (' **' ~ '%.3f'|format(v1)\
        \ ~ ' V** \U0001F7E2' if c1 == ns.max_idx else '%.3f'|format(v1) ~ ' V'))\
        \ -%}\n  {% set t2 = (' **' ~ '%.3f'|format(v2) ~ ' V** \U0001F534' if c2\
        \ == ns.min_idx else (' **' ~ '%.3f'|format(v2) ~ ' V** \U0001F7E2' if c2\
        \ == ns.max_idx else '%.3f'|format(v2) ~ ' V')) -%}\n  {% set t3 = (' **'\
        \ ~ '%.3f'|format(v3) ~ ' V** \U0001F534' if c3 == ns.min_idx else (' **'\
        \ ~ '%.3f'|format(v3) ~ ' V** \U0001F7E2' if c3 == ns.max_idx else '%.3f'|format(v3)\
        \ ~ ' V')) -%}\n  | **C{{ '%02d'|format(c1) }}:** {{ t1 }} | **C{{ '%02d'|format(c2)\
        \ }}:** {{ t2 }} | **C{{ '%02d'|format(c3) }}:** {{ t3 }} |\n{% endfor %}\n\
        \n{% endfor %}\n"
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: ⚡ ขีดจำกัดความปลอดภัย Inverter (CAN Bus Li2)
      subtitle: พารามิเตอร์ที่บอร์ดบริดจ์คำนวณและสื่อสารกับ Inverter PowMr แบบเรียลไทม์
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-entity-card
        entity: sensor.home_energy_inverter_bridge_logger_li2_charge_current_limit
        name: ขีดจำกัดกระแสชาร์จ (CCL)
