      - type: custom:mushroom-entity-card
        entity: sensor.home_energy_inverter_bridge_logger_li2_min_cell_voltage
        name: แรงดันเซลล์ต่ำสุดในระบบ
        icon: mdi:arrow-down-bold-box
        icon_color: cyan
    - type: custom:mushroom-title-card
      title: 🛡️ สุขภาพฮาร์ดแวร์ อุณหภูมิ และพลังงานสะสม
      subtitle: รายงานอุณหภูมิเซลล์ สุขภาพ (SOH) และหน่วยจ่ายไฟสะสมตลอดชีพ
    - type: markdown
      content: "### \U0001F6E1️ สุขภาพฮาร์ดแวร์ อุณหภูมิ และพลังงานสะสมรายแพ็ก (Huawei\
        \ ESM Cluster)\n\n| แพ็ก # | รุ่นโมดูล (Model) | โหมด BMS | อุณหภูมิ (Max/Min)\
        \ | สุขภาพ (SOH) | แรงดันแพ็ก | พลังงานจ่ายสะสมตลอดชีพ |\n|:---:|:---:|:---:|:---:|:---:|:---:|:---:|\n\
        {%- for p in range(1, 9) %}\n{%- set temp_max = states('sensor.huawei_esm_battery_system_pack_'\
        \ ~ p ~ '_max_cell_temperature')|float(0) %}\n{%- set temp_min = states('sensor.huawei_esm_battery_system_pack_'\
        \ ~ p ~ '_min_cell_temperature')|float(0) %}\n{%- set soh_val = states('sensor.huawei_esm_battery_system_pack_'\
        \ ~ p ~ '_state_of_health')|float(100) %}\n{%- set mode = states('sensor.huawei_esm_battery_system_pack_'\
        \ ~ p ~ '_bms_operating_mode')|int(0) %}\n{%- set mode_str = '\U0001F7E2 ชาร์จ'\
        \ if mode == 2 else ('⚡ จ่ายไฟ' if mode == 3 else '⚪ สแตนด์บาย') %}\n{%- set\
        \ v_pack = states('sensor.huawei_esm_battery_system_pack_' ~ p ~ '_battery_voltage')|float(0)\
        \ %}\n{%- set dchg_raw = states('sensor.huawei_esm_battery_system_pack_' ~\
        \ p ~ '_total_discharged_energy')|float(-1) %}\n{%- if dchg_raw < 0 %}\n \
        \ {%- set dchg_raw = states('sensor.home_energy_huawei_esm_battery_system_pack_'\
        \ ~ p ~ '_total_discharged_energy')|float(-1) %}\n{%- endif %}\n{%- set dchg_text\
        \ = '{:,.1f} kWh'.format(dchg_raw / 1000.0) if dchg_raw > 0 else '-' %}\n\
        {%- set temp_badge = '\U0001F7E2' if temp_max < 38 else ('\U0001F7E1' if temp_max\
        \ < 45 else '\U0001F534') %}\n| **Pack #{{ p }}** | ESM-48100B1 | {{ mode_str\
        \ }} | {{ temp_badge }} {{ '%.0f'|format(temp_max) }}°C / {{ '%.0f'|format(temp_min)\
        \ }}°C | {{ '%.0f'|format(soh_val) }}% | {{ '%.2f'|format(v_pack) }} V | **{{\
        \ dchg_text }}** |\n{%- endfor %}\n\n> ℹ️ *ข้อมูลฮาร์ดแวร์จริง: ถอดรหัสสดจากรีจิสเตอร์มาตรฐาน:\
        \ 0x0001 (Voltage), 0x0004 (SOH), 0x0005/0x0006 (Temp), 0x000E (BMS Mode)\
        \ และ 0x0342 (Lifetime Discharged Energy)*"
    - type: custom:mushroom-template-card
      primary: ดาวน์โหลด Log ความละเอียดสูงจาก MicroSD (.CSV)
      secondary: แตะเปิดเว็บเซิร์ฟเวอร์บอร์ด Inverter Bridge (http://192.168.8.109:8080)
        เพื่อดึง Log 1 วินาที
      icon: mdi:file-delimited-outline
      icon_color: teal
      tap_action:
        action: url
        url_path: http://192.168.8.109:8080
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: 🏷️ ป้ายทะเบียนดิจิทัล & เนมเพลตประจำโมดูล (ESM-48100B1 Nameplates)
      subtitle: รายละเอียดคลัสเตอร์ 8 แพ็ก 800Ah / 38.4 kWh และการจัดพอร์ตบัสแยกอิสระ
    - type: markdown
      content: '| แพ็ก # | ยี่ห้อ & รุ่นโมดูล (Model) | พิกัดแรงดัน/ความจุ | DIP Slave
        ID | พอร์ตบัสสื่อสาร | สถานะคลัสเตอร์ |

        |:---:|:---|:---:|:---:|:---:|:---:|

