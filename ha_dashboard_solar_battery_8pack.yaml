        | **Pack #2** | Huawei ESM-48100B1 (15S LiFePO4) | 48V 100Ah (4.8 kWh) | ID
        215 (0xD7) | Port 1 (GPIO 33/32) | 🟢 ออนไลน์ทำงาน |

        | **Pack #3** | Huawei ESM-48100B1 (15S LiFePO4) | 48V 100Ah (4.8 kWh) | ID
        216 (0xD8) | Port 1 (GPIO 33/32) | 🟢 ออนไลน์ทำงาน |

        | **Pack #4** | Huawei ESM-48100B1 (15S LiFePO4) | 48V 100Ah (4.8 kWh) | ID
        214 (0xD6) | Port 2 (GPIO 18/25) | 🛡️ บัสแยกอิสระ |

        | **Pack #5** | Huawei ESM-48100B1 (15S LiFePO4) | 48V 100Ah (4.8 kWh) | ID
        218 (0xDA) | Port 1 (GPIO 33/32) | 🟢 ออนไลน์ทำงาน |

        | **Pack #6** | Huawei ESM-48100B1 (15S LiFePO4) | 48V 100Ah (4.8 kWh) | ID
        219 (0xDB) | Port 1 (GPIO 33/32) | 🟢 ออนไลน์ทำงาน |

        | **Pack #7** | Huawei ESM-48100B1 (15S LiFePO4) | 48V 100Ah (4.8 kWh) | ID
        220 (0xDC) | Port 1 (GPIO 33/32) | 🟢 ออนไลน์ทำงาน |

        | **Pack #8** | Huawei ESM-48100B1 (15S LiFePO4) | 48V 100Ah (4.8 kWh) | ID
