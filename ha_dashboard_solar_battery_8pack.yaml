          %}ha-card { background: {{ ''rgba(16, 185, 129, 0.10)'' if cur < -2.0 else
          (''rgba(245, 158, 11, 0.10)'' if cur > 2.0 else ''rgba(59, 130, 246, 0.08)'')
          }}; border: 1px solid {{ ''rgba(16, 185, 129, 0.35)'' if cur < -2.0 else
