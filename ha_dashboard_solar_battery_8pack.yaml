views:
- path: default_view
  title: Home Energy
  icon: mdi:solar-power
  type: masonry
  badges: []
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        icon: mdi:solar-power
        icon_color: green
        content: ⚡ ภาพรวมระบบ
        tap_action:
          action: navigate
          navigation_path: /home-energy
      - type: template
        icon: mdi:battery-heart-variant
        icon_color: blue
        content: 🔬 120 เซลล์
        tap_action:
          action: navigate
          navigation_path: /home-energy/cell-diagnostics
      - type: template
        icon: mdi:tune-vertical
        icon_color: purple
        content: ⚙️ ตั้งค่าอินเวอร์เตอร์
        tap_action:
          action: navigate
          navigation_path: /home-energy/inverter-setup
      - type: template
        icon: mdi:battery-check
        icon_color: '{{ ''green'' if states(''sensor.battery_system_active_packs_count'')
          | int(0) == 8 else ''amber'' }}'
        content: ออนไลน์ {{ states('sensor.battery_system_active_packs_count') }}/8
          แพ็ก (ΔV {{ states('sensor.battery_system_voltage_delta') }}V)
      - type: template
        icon: mdi:swap-horizontal-bold
        icon_color: '{{ ''green'' if states(''sensor.home_energy_inverter_bridge_logger_inverter_queries_count'')|float(0)
          > 0 else ''red'' }}'
        content: '{% set q = states(''sensor.home_energy_inverter_bridge_logger_inverter_queries_count'')|float(0)
          %}{% if q > 0 %}Inverter CAN: {{ ''{:,.0f}''.format(q) }} Q{% else %}Inverter
          CAN: Offline{% endif %}'
        tap_action:
          action: more-info
          entity: sensor.home_energy_inverter_bridge_logger_inverter_queries_count
      - type: template
        icon: mdi:battery-charging-high
        icon_color: blue
        content: พร้อมจ่าย {{ states('sensor.battery_usable_energy_to_30_percent_kwh')
          }} kWh
      - type: template
        icon: mdi:battery-clock
        icon_color: cyan
        content: ⏳ พอใช้ {{ states('sensor.battery_hours_remaining') }} ชม. (ถึง {{
          states('sensor.battery_depletion_projected_time') }})
      - type: template
        icon: mdi:weather-sunny
        icon_color: amber
        content: ☀️ พรุ่งนี้ {{ states('sensor.energy_production_tomorrow') | round(1)
          }} kWh
    - type: custom:solar-bar-card
      title: HomeBall Energy Center
      inverter_size: 7.5
      battery_capacity: 38.4
      color_palette: classic-solar
      power_unit: kW
      decimal_places: 2
      battery_soc_decimal_places: 1
      segment_text_solar_home: ☀️➔🏠 {value}
      segment_text_battery_charge: ☀️➔🔋 {value}
      segment_text_export: ☀️➔⚡ {value}
      show_header: true
      show_weather: true
      weather_entity: weather.forecast_home
      header_sensor_1:
        entity: sensor.battery_usable_energy_to_30_percent_kwh
        name: พร้อมจ่าย (หัก 30% สำรอง)
        icon: mdi:battery-charging-high
      header_sensor_2:
        entity: sensor.solar_energy_cost_saved_today
        name: ประหยัดวันนี้
        icon: mdi:cash-multiple
      production_entity: sensor.home_energy_em11000_solar_total_power
      production_history_entity: sensor.home_energy_em11000_energy_today
      self_consumption_entity: sensor.home_energy_em11000_output_power
      grid_power_entity: sensor.home_energy_em11000_grid_power
      invert_grid_power: true
      battery_power_entity: sensor.huawei_esm_battery_system_total_battery_system_power
      battery_soc_entity: sensor.huawei_esm_battery_system_total_battery_system_soc
      invert_battery_power: false
      show_battery_indicator: true
      show_battery_flow: true
      battery_flow_animation_speed: 1.5
      show_stats: true
      show_stats_detail: true
      stats_detail_position: below
      stats_border_radius: 10
      show_legend: true
      show_legend_values: true
      show_bar_label: true
      show_bar_values: true
      show_house_icon: true
      show_grid_icon_always: true
      show_energy_flow: true
      energy_flow_speed: 1.8
      energy_flow_threshold: 0.05
      energy_flow_origin: bar_center
      disable_animation: false
      use_solcast: false
      custom_labels:
        solar: โซลาร์เซลล์
        usage: ใช้ไฟในบ้าน
        battery: แบตเตอรี่
        export: ขายไฟ
        import: ไฟหลวง (PEA)
        grid_idle: สแตนด์บาย
        grid_import: ใช้ไฟหลวง
        grid_export: ขายไฟ
    - type: custom:sunsynk-power-flow-card
      cardstyle: full
      wide: false
      large_font: true
      show_solar: true
      show_battery: true
      show_grid: true
      center_no_grid: false
      card_height: 100%
      card_width: 100%
      decimal_places: 2
      decimal_places_energy: 1
      dynamic_line_width: true
      max_line_width: 5
      min_line_width: 2
      inverter:
        modern: true
        colour: '#1e88e5'
        autarky: energy
        model: deye
        auto_scale: true
        three_phase: false
        navigate: ''
        label_autarky: ''
        label_ratio: ''
      battery:
        show_daily: true
        count: 1
        max_power: 11000
        soc_end_of_charge: 100
        soc_decimal_places: 1
        energy: 38400
        shutdown_soc: 30
        shutdown_soc_offgrid: 20
        auto_scale: true
        show_absolute: true
        invert_power: true
        dynamic_colour: false
        linear_gradient: true
        hide_soc: false
        animate: true
        show_remaining_energy: true
        remaining_energy_to_shutdown: true
        invert_flow: false
        animation_speed: 1.5
      solar:
        show_daily: true
        mppts: 2
        auto_scale: true
        dynamic_colour: false
        animation_speed: 1.5
        max_power: 7500
        pv1_max_power: 4000
        pv2_max_power: 3500
        pv1_name: String 1
        pv2_name: String 2
        invert_flow: false
      load:
        show_daily: true
        dynamic_icon: true
        dynamic_colour: false
        animation_speed: 1.5
        essential_name: House Load
      grid:
        show_daily_buy: true
        show_daily_sell: false
        show_nonessential: false
        auto_scale: true
        dynamic_colour: false
        invert_flow: false
      entities:
        inverter_status_59: binary_sensor.home_energy_em11000_status
        grid_connected_status_194: binary_sensor.home_energy_em11000_grid_connected
        inverter_voltage_154: sensor.home_energy_em11000_output_voltage
        inverter_current_164: sensor.home_energy_em11000_output_current
        inverter_power_175: sensor.home_energy_em11000_output_power
        dc_transformer_temp_90: sensor.home_energy_em11000_inverter_temperature
        radiator_temp_91: sensor.home_energy_em11000_dc_module_temperature
        environment_temp: sensor.home_energy_em11000_pv_temperature
        load_frequency_192: sensor.home_energy_em11000_output_frequency
        essential_power: sensor.home_energy_em11000_output_power
        solar_power_185: sensor.home_energy_em11000_solar_total_power
        pv1_power_186: sensor.home_energy_em11000_pv1_power
        pv1_voltage_109: sensor.home_energy_em11000_pv1_voltage
        pv1_current_110: sensor.home_energy_em11000_pv1_current
        pv2_power_187: sensor.home_energy_em11000_pv2_power
        pv2_voltage_111: sensor.home_energy_em11000_pv2_voltage
        pv2_current_112: sensor.home_energy_em11000_pv2_current
        day_pv_energy_108: sensor.home_energy_em11000_energy_today
        total_pv_generation: sensor.home_energy_em11000_energy_total
        grid_power_169: sensor.home_energy_em11000_grid_power
        grid_ct_power_172: sensor.home_energy_em11000_grid_power
        grid_voltage: sensor.home_energy_em11000_grid_voltage
        battery_soc_184: sensor.huawei_esm_battery_system_total_battery_system_soc
        battery_power_190: sensor.huawei_esm_battery_system_total_battery_system_power
        battery_current_191: sensor.huawei_esm_battery_system_total_battery_system_current
        battery_voltage_183: sensor.huawei_esm_battery_system_total_battery_system_voltage
        battery_temp_182: sensor.huawei_esm_battery_system_max_battery_cell_temperature
        battery_rated_capacity: sensor.huawei_esm_battery_system_total_battery_system_nominal_capacity
        battery_current_direction: sensor.home_energy_em11000_battery_current_direction
        battery_soh: sensor.huawei_esm_battery_system_total_battery_system_soh
        day_battery_charge_70: sensor.home_energy_em11000_day_battery_charge
        day_battery_discharge_71: sensor.home_energy_em11000_day_battery_discharge
        day_load_energy_84: sensor.house_energy_daily
        day_grid_import_76: sensor.grid_energy_daily
    - type: custom:mushroom-template-card
      primary: '🔋 การจ่ายไฟข้ามคืน: {{ states(''sensor.battery_overnight_endurance_status'')
        }}'
      secondary: '⚡ พร้อมจ่าย {{ states(''sensor.battery_usable_energy_to_30_percent_kwh'')
        }} kWh (~{{ states(''sensor.battery_hours_remaining'') }} ชม.) | ☀️ แดดพรุ่งนี้:
        {{ states(''sensor.energy_production_tomorrow'') }} kWh (พีคเที่ยงตรง)'
      icon: mdi:shield-sun
      icon_color: green
    - type: custom:mushroom-title-card
      title: Solar Financial ROI & Energy Ledger
      subtitle: สรุปสถิติการประหยัดไฟจริงและการใช้พลังงาน รายวันและรอบบิล (ตัดรอบวันที่
        20)
    - type: markdown
      content: "## \U0001F4B0 บัญชีสรุปค่าไฟและเงินที่ประหยัดได้\nอัตราค่าไฟอ้างอิง:\
        \ **4.50 บาท/หน่วย** | ตัดรอบบิลทุกวันที่ **20** ของเดือน\n\n<div style=\"\
        margin: 8px 0 12px 0; padding: 12px 16px; background: rgba(33, 150, 243, 0.08);\
        \ border-left: 4px solid #2196f3; border-radius: 6px; font-size: 13.5px; line-height:\
        \ 1.6;\">\n  {% set grid_today = states('sensor.grid_energy_daily') | float(0)\
        \ %}\n  {% set grid_cost_today = states('sensor.grid_cost_today') | float(0)\
        \ %}\n  {% set saved_today = states('sensor.net_solar_savings_today') | float(0)\
        \ %}\n  {% set house_cost_today = states('sensor.house_cost_today') | float(0)\
        \ %}\n  {% set grid_cycle = states('sensor.grid_energy_billing_cycle') | float(0)\
        \ %}\n  {% set grid_cost_normal = states('sensor.grid_cost_billing_cycle')\
        \ | float(0) %}\n  {% set grid_cost_pea = states('sensor.grid_cost_billing_cycle_pea_net')\
        \ | float(0) %}\n  \n  <b>⚡ สรุปวันนี้:</b> ดึงไฟหลวงมาใช้ <b>{{ '%.2f'|format(grid_today)\
        \ }} หน่วย</b> (จ่ายการไฟฟ้า <b>฿{{ '%.2f'|format(grid_cost_today) }}</b>)\
        \ | โซลาร์+แบตช่วยประหยัดไป <b>฿{{ '%.2f'|format(saved_today) }}</b> (มูลค่าไฟบ้านทั้งหมด\
        \ ฿{{ '%.2f'|format(house_cost_today) }})<br>\n  <b>\U0001F9FE สรุปยอดเตรียมจ่ายบิล\
        \ PEA รอบนี้ (20 ต.ค. - วันนี้):</b> ดึงไฟหลวงสะสม <b>{{ '%.2f'|format(grid_cycle)\
        \ }} หน่วย</b> (เรทปกติ ฿{{ '%.2f'|format(grid_cost_normal) }})<br>\n  \U0001F449\
        \ <span style=\"color: #4caf50; font-weight: bold;\">\U0001F381 หักสิทธิส่วนลด\
        \ 50 หน่วยแรกแล้ว เหลือยอดเรียกเก็บจริงบิล PEA เพียง ฿{{ '%.2f'|format(grid_cost_pea)\
        \ }}</span>\n</div>\n\n<center>\n<table style=\"width: 100%; border-collapse:\
        \ collapse; text-align: center; font-size: 13.5px;\">\n  <thead>\n    <tr\
        \ style=\"background: rgba(255,255,255,0.05); color: var(--secondary-text-color,\
        \ #9e9e9e);\">\n      <th style=\"border: 1px solid var(--divider-color, rgba(127,127,127,0.18));\
        \ padding: 8px 6px;\">ช่วงเวลา</th>\n      <th style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px; color: #f44336;\">⚡ ไฟหลวง PEA<br><small\
        \ style=\"font-weight: normal; font-size: 11px;\">(ที่ต้องจ่ายบิล)</small></th>\n\
        \      <th style=\"border: 1px solid var(--divider-color, rgba(127,127,127,0.18));\
        \ padding: 8px 6px; color: #4caf50;\">\U0001F4B0 โซลาร์+แบต<br><small style=\"\
        font-weight: normal; font-size: 11px;\">(ช่วยประหยัดเงิน)</small></th>\n \
        \     <th style=\"border: 1px solid var(--divider-color, rgba(127,127,127,0.18));\
        \ padding: 8px 6px; color: #2196f3;\">\U0001F3E0 บ้านใช้ไฟทั้งหมด</th>\n \
        \     <th style=\"border: 1px solid var(--divider-color, rgba(127,127,127,0.18));\
        \ padding: 8px 6px; color: #ff9800;\">☀️ โซลาร์ผลิตรวม</th>\n    </tr>\n \
        \ </thead>\n  <tbody>\n    <tr>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px; font-weight: bold;\">วันนี้</td>\n\
        \      <td style=\"border: 1px solid var(--divider-color, rgba(127,127,127,0.18));\
        \ padding: 8px 6px;\">{{ states('sensor.grid_energy_daily') }} หน่วย<br><span\
        \ style=\"color: #ef5350; font-weight: bold;\">จ่าย ฿{{ '%.2f'|format(states('sensor.grid_cost_today')|float(0))\
        \ }}</span></td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px; font-weight: bold; color: #4caf50;\"\
        >{{ states('sensor.solar_load_offset_today_kwh') }} หน่วย<br><span style=\"\
        color: #4caf50; font-weight: bold; font-size: 13.5px;\">ประหยัด ฿{{ '%.2f'|format(states('sensor.net_solar_savings_today')|float(0))\
        \ }}</span></td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px;\">{{ states('sensor.house_energy_daily')\
        \ }} หน่วย<br><small style=\"color: #90caf9;\">มูลค่า ฿{{ '%.2f'|format(states('sensor.house_cost_today')|float(0))\
        \ }}</small></td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px;\">{{ states('sensor.home_energy_em11000_energy_today')\
        \ }} หน่วย<br><small style=\"color: #64b5f6;\">(เก็บเข้าแบต {{ states('sensor.home_energy_em11000_day_battery_charge')\
        \ }} หน่วย)</small></td>\n    </tr>\n    <tr>\n      <td style=\"border: 1px\
        \ solid var(--divider-color, rgba(127,127,127,0.18)); padding: 8px 6px; font-weight:\
        \ bold;\">เมื่อวาน</td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px;\">{{ state_attr('sensor.grid_energy_daily',\
        \ 'last_period') or '-' }} หน่วย<br><span style=\"color: #ef5350; font-weight:\
        \ bold;\">จ่าย ฿{{ '%.2f'|format(states('sensor.grid_cost_yesterday')|float(0))\
        \ }}</span></td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px; font-weight: bold; color: #4caf50;\"\
        >{{ states('sensor.solar_load_offset_yesterday_kwh') }} หน่วย<br><span style=\"\
        color: #4caf50; font-weight: bold; font-size: 13.5px;\">ประหยัด ฿{{ '%.2f'|format(states('sensor.net_solar_savings_yesterday')|float(0))\
        \ }}</span></td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px;\">{{ state_attr('sensor.house_energy_daily',\
        \ 'last_period') or '-' }} หน่วย<br><small style=\"color: #90caf9;\">มูลค่า\
        \ ฿{{ '%.2f'|format(states('sensor.house_cost_yesterday')|float(0)) }}</small></td>\n\
        \      <td style=\"border: 1px solid var(--divider-color, rgba(127,127,127,0.18));\
        \ padding: 8px 6px;\">{{ state_attr('sensor.solar_energy_daily', 'last_period')\
        \ or '-' }} หน่วย</td>\n    </tr>\n    <tr style=\"background: rgba(255,255,255,0.03);\"\
        >\n      <td style=\"border: 1px solid var(--divider-color, rgba(127,127,127,0.18));\
        \ padding: 8px 6px; font-weight: bold;\">รอบบิลนี้สะสม<br><small style=\"\
        font-weight: normal; color: var(--secondary-text-color);\">(20 ต.ค. - วันนี้)</small></td>\n\
        \      <td style=\"border: 1px solid var(--divider-color, rgba(127,127,127,0.18));\
        \ padding: 8px 6px; font-weight: bold;\">{{ states('sensor.grid_energy_billing_cycle')\
        \ }} หน่วย<br><span style=\"color: #ef5350; font-weight: bold; font-size:\
        \ 14px;\">บิล PEA ฿{{ '%.2f'|format(states('sensor.grid_cost_billing_cycle_pea_net')|float(0))\
        \ }}</span><br><small style=\"color: #4caf50; font-size: 11px;\">(เรทปกติ\
        \ ฿{{ '%.2f'|format(states('sensor.grid_cost_billing_cycle')|float(0)) }}\
        \ หักส่วนลด 50 หน่วย)</small></td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px; font-weight: bold; font-size:\
        \ 14px; color: #4caf50;\">{{ states('sensor.solar_load_offset_billing_cycle_kwh')\
        \ }} หน่วย<br><span style=\"color: #4caf50; font-weight: bold; font-size:\
        \ 14px;\">ประหยัด ฿{{ '%.2f'|format(states('sensor.net_solar_savings_billing_cycle')|float(0))\
        \ }}</span></td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px; font-weight: bold;\">{{ states('sensor.house_energy_billing_cycle')\
        \ }} หน่วย<br><small style=\"color: #90caf9;\">มูลค่า ฿{{ '%.2f'|format(states('sensor.house_cost_billing_cycle')|float(0))\
        \ }}</small></td>\n      <td style=\"border: 1px solid var(--divider-color,\
        \ rgba(127,127,127,0.18)); padding: 8px 6px; font-weight: bold;\">{{ states('sensor.solar_energy_billing_cycle')\
        \ }} หน่วย</td>\n    </tr>\n  </tbody>\n</table>\n</center>\n\n<div style=\"\
        margin-top: 8px; font-size: 12px; color: var(--secondary-text-color); line-height:\
        \ 1.5;\">\n• <b>ยอดประหยัดจริง:</b> คำนวณเฉพาะไฟที่โซลาร์และแบตเตอรี่จ่ายทดแทนไฟหลวงเข้าบ้านจริง\
        \ (เรท 4.50 บ./หน่วย)<br>\n• <b>ไฟหลวงรอบบิลนี้:</b> คำนวณตามสูตรสิทธิ์ลดหย่อน\
        \ PEA ขั้นบันไดสุทธิ ซึ่งตรงกับบิลเรียกเก็บจริงที่จะส่งมาที่บ้าน<br>\n• <b>รอบบิลก่อนหน้า\
        \ (ก่อนติดตั้งระบบเต็ม):</b> ใช้ไฟหลวง 351 หน่วย (จ่ายบิลจริง ฿1,233.81)\n\
        </div>"
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Huawei ESM Battery Bank
      subtitle: 8 Packs Cluster (48V 800Ah / 38.4 kWh)
    - type: custom:mushroom-template-card
      primary: '{% set pwr = states(''sensor.huawei_esm_battery_system_total_battery_system_power'')|float(0)
        %}{% set cur = states(''sensor.huawei_esm_battery_system_total_battery_system_current'')|float(0)
        %}{% if cur < -2.0 %}🔋 แบตเตอรีกำลังจ่ายไฟเข้าบ้าน (Discharging){% elif cur
        > 2.0 %}⚡ แบตเตอรีกำลังชาร์จไฟจากโซลาร์ (Charging){% else %}💤 แบตเตอรี่สแตนด์บาย
        (พร้อมใช้งาน){% endif %}'
      secondary: '{% set pwr = states(''sensor.huawei_esm_battery_system_total_battery_system_power'')|float(0)
        %}{% set cur = states(''sensor.huawei_esm_battery_system_total_battery_system_current'')|float(0)
        %}{% set soc = states(''sensor.huawei_esm_battery_system_total_battery_system_soc'')|float(0)
        %}{% set usable = states(''sensor.battery_usable_energy_to_30_percent_kwh'')|float(0)
        %}{% if cur < -2.0 %}จ่ายออก {{ ''%.1f''|format(pwr|abs / 1000) }} kW ({{
        ''%.1f''|format(cur|abs) }} A) | แบตเตอรี่คงเหลือ {{ ''%.0f''|format(soc)
        }}% (พร้อมจ่ายอีก {{ ''%.1f''|format(usable) }} kWh){% elif cur > 2.0 %}รับชาร์จ
        {{ ''%.1f''|format(pwr / 1000) }} kW ({{ ''%.1f''|format(cur) }} A) | กำลังเก็บสะสมความจุ
