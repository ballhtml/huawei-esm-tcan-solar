        > 📌 **สเปกคลัสเตอร์รวม:** แรงดันมาตรฐาน 48V (51.2V Typ.) • ความจุรวม **800Ah
        (38.4 kWh)** • ทั้งหมด 120 เซลล์ (15S8P) • พิกัดจ่ายกระแสรวม 300A • มีบัสแยกอิสระ
        2 แพ็ก (Pack 4 & Pack 8) ป้องกันการรบกวนของแอดเดรสและสัญญาณรบกวน 100% • สื่อสาร
        Inverter MaxSky EM11000 ผ่าน CAN Bus Pylontech (`LI2`)'
- title: Inverter Setup
  path: inverter-setup
  icon: mdi:tune-vertical
  type: masonry
  badges: []
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: ⚙️ โหมดทำงาน & ลำดับจ่ายไฟ
      subtitle: Main Priority & AC Grid Specifications
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
      - type: template
        icon: mdi:power-settings
        icon_color: blue
        content: '{{ states(''sensor.home_energy_em11000_operating_mode'') }}'
      - type: template
        icon: mdi:sine-wave
        icon_color: green
        content: '{{ states(''sensor.home_energy_em11000_grid_frequency'') }} Hz'
      - type: template
        icon: mdi:flash
        icon_color: amber
        content: '{{ states(''sensor.home_energy_em11000_output_voltage'') }} V'
      - type: template
        icon: mdi:home-lightning-bolt
        icon_color: purple
        content: '{{ states(''sensor.home_energy_em11000_load_power'') }} W'
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        entity: button.home_energy_em11000_read_inverter_settings_now
        primary: 🔄 อ่านค่าปัจจุบัน (Read Now)
        secondary: กดเพื่อ Sync พารามิเตอร์ 40 ค่าจาก Inverter
        icon: mdi:book-sync
        icon_color: amber
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.home_energy_em11000_read_inverter_settings_now
      - type: custom:mushroom-template-card
        entity: button.home_energy_em11000_refresh_telemetry
        primary: ⚡ รีเฟรชสถานะไฟ (Live)
        secondary: อัปเดตเซนเซอร์พลังงานทันที
        icon: mdi:refresh
        icon_color: cyan
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.home_energy_em11000_refresh_telemetry
    - type: custom:mushroom-select-card
      entity: select.home_energy_em11000_main_output_priority
      name: Main Output Priority (ลำดับจ่ายโหลด)
      icon: mdi:power-cycle
    - type: custom:mushroom-select-card
      entity: select.home_energy_em11000_charger_source_priority
      name: Charger Priority (ลำดับการชาร์จ)
      icon: mdi:battery-charging
    - type: entities
      title: ⏰ ตั้งเวลาสลับลำดับจ่ายไฟและชาร์จ (Time-of-Use Schedule)
      show_header_toggle: false
      entities:
      - entity: select.home_energy_em11000_secondary_output_priority
        name: Secondary Output Priority (จ่ายไฟสำรอง)
        icon: mdi:clock-fast
      - entity: time.home_energy_em11000_secondary_output_priority_start_time
        name: เวลาเริ่มจ่ายไฟสำรอง (Output Start Time)
        icon: mdi:clock-start
      - entity: time.home_energy_em11000_secondary_output_priority_end_time
        name: เวลาสิ้นสุดจ่ายไฟสำรอง (Output End Time)
        icon: mdi:clock-end
      - type: divider
      - entity: select.home_energy_em11000_secondary_charging_priority
        name: Secondary Charging Priority (ชาร์จไฟสำรอง)
        icon: mdi:battery-clock
      - entity: time.home_energy_em11000_secondary_charging_priority_start_time
        name: เวลาเริ่มชาร์จสำรอง (Charging Start Time)
        icon: mdi:clock-start
      - entity: time.home_energy_em11000_secondary_charging_priority_end_time
        name: เวลาสิ้นสุดชาร์จสำรอง (Charging End Time)
        icon: mdi:clock-end
    - type: custom:mushroom-select-card
      entity: select.home_energy_em11000_input_mode
      name: AC Input Range (ย่านไฟหลวง APL/UPS)
      icon: mdi:transmission-tower
    - type: custom:mushroom-select-card
      entity: select.home_energy_em11000_output_voltage_setting
      name: AC Output Voltage (แรงดันไฟออก)
      icon: mdi:flash-outline
    - type: custom:mushroom-select-card
      entity: select.home_energy_em11000_output_frequency_setting
      name: AC Output Frequency (ความถี่ไฟออก)
      icon: mdi:sine-wave
    - type: entities
      title: 🖥️ ตัวเครื่อง หน้าจอ และเสียงแจ้งเตือน
      show_header_toggle: false
      entities:
      - entity: select.home_energy_em11000_buzzer_mode
        name: Buzzer Mode (เสียงเตือน)
      - entity: select.home_energy_em11000_lcd_backlight
        name: LCD Backlight (ไฟหน้าจอ)
      - entity: select.home_energy_em11000_lcd_automatically_returns_to_the_homepage
        name: LCD Auto Return (กลับหน้าแรกอัตโนมัติ)
      - entity: select.home_energy_em11000_overload_transfer_to_bypass_enable
        name: Overload Bypass (โหลดเกินดึงไฟหลวง)
      - entity: select.home_energy_em11000_overload_automatic_restart
        name: Overload Auto Restart (เริ่มใหม่เมื่อหายโหลดเกิน)
      - entity: select.home_energy_em11000_automatic_restart_when_over_temperature
        name: Over Temp Auto Restart (เริ่มใหม่เมื่ออุณหภูมิลด)
      - entity: select.home_energy_em11000_energy_saving_mode_switch
        name: Energy Saving Mode (โหมดประหยัดพลังงาน)
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: 🔋 พารามิเตอร์แบตเตอรี่ & กระแสชาร์จ
      subtitle: Battery Chemistry & Current Thresholds
    - type: custom:mushroom-select-card
      entity: select.home_energy_em11000_battery_type
      name: Battery Type (ประเภทแบตเตอรี่)
      icon: mdi:battery-heart-variant
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        entity: select.home_energy_em11000_battery_type
        primary: สลับเป็นโหมด Li2
        secondary: '{% if is_state(''select.home_energy_em11000_battery_type'', ''Li2'')
          %}🟢 ใช้งานอยู่ (Pylontech CAN){% else %}แตะเพื่อสลับเป็น Li2{% endif %}'
        icon: mdi:battery-sync
        icon_color: '{% if is_state(''select.home_energy_em11000_battery_type'', ''Li2'')
          %}blue{% else %}grey{% endif %}'
        tap_action:
          action: call-service
          service: select.select_option
          target:
            entity_id: select.home_energy_em11000_battery_type
          data:
            option: Li2
          confirmation:
            text: ยืนยันการสลับโหมดแบตเตอรี่เป็น Li2 (Pylontech CAN BMS) ไปยังอินเวอร์เตอร์?
      - type: custom:mushroom-template-card
        entity: button.home_energy_em11000_apply_user_mode_profile
        primary: เขียนโปรไฟล์ 15S Huawei
        secondary: Bulk 54.0V / Float 53.2V
        icon: mdi:tune-vertical
        icon_color: green
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.home_energy_em11000_apply_user_mode_profile
          confirmation:
            text: 'ยืนยันการตั้งค่า Profile โหมด USER (15S Huawei: Bulk 54.0V, Float
              53.2V) ไปยังอินเวอร์เตอร์?'
    - type: entities
      title: ⚡ พิกัดกระแสชาร์จและคายประจุ
      show_header_toggle: false
      entities:
      - entity: number.home_energy_em11000_maximum_charging_current
        name: Max Charging Current (กระแสชาร์จรวมสูงสุด)
      - entity: number.home_energy_em11000_maximum_mains_charging_current
        name: Max Utility Current (กระแสชาร์จไฟหลวง)
      - entity: number.home_energy_em11000_maximum_discharge_current_protection
        name: Max Discharge Current (ตัดกระแสคายประจุ)
    - type: entities
      title: 📈 ระดับแรงดันชาร์จ (สำหรับโหมด USER)
      show_header_toggle: false
      entities:
      - entity: number.home_energy_em11000_maximum_charging_voltage
        name: Bulk Voltage (แรงดันชาร์จสูงสุด)
      - entity: number.home_energy_em11000_floating_charge_voltage
        name: Float Voltage (แรงดันเลี้ยงลอยตัว)
      - entity: number.home_energy_em11000_constant_pressure_to_float_waiting_time
        name: Float Wait Time (เวลารอเข้าสู่ Float)
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: 🛡️ จุดตัดความปลอดภัย & ปรับสมดุล (EQ)
      subtitle: Cut-off Points, Equalization & Tools
    - type: entities
      title: ⚠️ จุดตัดแรงดันและกลับไปไฟหลวง
      show_header_toggle: false
      entities:
      - entity: number.home_energy_em11000_mains_mode_battery_discharge_recovery_point
        name: Back to Grid (กลับไปไฟหลวงเมื่อแบตลดถึง)
      - entity: number.home_energy_em11000_mains_mode_battery_low_voltage_protection_point
        name: Low Cut-off (ตัดไฟแบตต่ำในโหมด Grid)
      - entity: number.home_energy_em11000_off_grid_mode_battery_low_voltage_protection_point
        name: Off-grid Cut-off (ตัดไฟแบตต่ำในโหมด Off-grid)
      - entity: number.home_energy_em11000_battery_overvoltage_protection_point
        name: Overvoltage Cut-off (ตัดแรงดันแบตเกิน)
    - type: entities
      title: ⚖️ การปรับสมดุลเซลล์ (Battery Equalization)
      show_header_toggle: false
      entities:
      - entity: select.home_energy_em11000_battery_eq_mode_enable
        name: Battery EQ Enable (เปิด/ปิด EQ)
      - entity: number.home_energy_em11000_eq_charging_voltage
        name: EQ Charging Voltage (แรงดัน EQ)
      - entity: number.home_energy_em11000_bat_eq_time
        name: EQ Duration (ระยะเวลาทำ EQ)
      - entity: number.home_energy_em11000_eq_charging_interval
        name: EQ Interval (รอบวันทำ EQ)
      - entity: button.home_energy_em11000_manually_force_eq_to_charge_once
        name: Force EQ Now (สั่งทำ EQ ทันที)
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        entity: button.home_energy_em11000_exit_the_fail_lock_state_only_if_the_machine_enters_the_fail_out_mode
        primary: ปลดล็อก Fault Mode
        secondary: กดเพื่อปลดล็อก Error
        icon: mdi:lock-open-alert
        icon_color: red
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.home_energy_em11000_exit_the_fail_lock_state_only_if_the_machine_enters_the_fail_out_mode
          confirmation:
            text: ยืนยันการส่งคำสั่งปลดล็อก Fault Mode ไปยัง Inverter EM11000?
      - type: custom:mushroom-template-card
        entity: button.home_energy_em11000_refresh_telemetry
        primary: รีเฟรชค่าเดี๋ยวนี้
        secondary: ดึงข้อมูลจากเครื่องทันที
        icon: mdi:refresh
        icon_color: cyan
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.home_energy_em11000_refresh_telemetry
    - type: markdown
      title: '📋 ตารางค่าแนะนำ: แบตเตอรี่ Huawei ESM 15S'
      content: '| พารามิเตอร์ | ค่ามาตรฐาน 15S | วัตถุประสงค์ความปลอดภัย |

        |---|:---:|---|

        | **Bulk Charge** | `54.0 V` | เฉลี่ย 3.60V/Cell (ถนอมเซลล์ ไม่บวม) |

        | **Float Charge** | `53.2 V` | เฉลี่ย 3.54V/Cell (ตัดปัญหา Overcharge) |

        | **Back to Grid** | `50.0 V` | เฉลี่ย 3.33V/Cell (~20-25% SOC สำรอง) |

        | **Low Cut-off** | `46.2 V` | เฉลี่ย 3.08V/Cell (ป้องกันคายประจุลึก) |

        | **Max Current** | `140 A` | แบ่งเข้า 8 แพ็ก เฉลี่ย ~17.5A/แพ็ก เย็นเฉียบ
        |'
