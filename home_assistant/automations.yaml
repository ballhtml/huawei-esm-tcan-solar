- id: lg_washer_paused_stopped_alert
  alias: 'LG เครื่องซักผ้า: แจ้งเตือนเครื่องหยุดทำงานกลางคัน (Pause ค้าง / น้ำไม่เข้า / ดับกะทันหัน)'
  description: แจ้งเตือนเมื่อเครื่องซักผ้าหลักหรือขนาดเล็กหยุดชะงัก (Pause) ค้างเกิน 45 วินาที หรือดับกลางคันขณะกำลังซัก (มักเกิดจากแรงดันน้ำตก น้ำไม่เข้า หรือไฟดับ)
  trigger:
    - platform: state
      entity_id:
        - sensor.ekhruue_ngchakphaa_current_status
        - sensor.ekhruue_ngchakphaakhnaadelk_current_status
      from:
        - running
        - rinsing
        - spinning
        - soaking
        - prewash
        - detecting
        - drying
      to: pause
      for:
        seconds: 45
    - platform: state
      entity_id:
        - sensor.ekhruue_ngchakphaa_current_status
        - sensor.ekhruue_ngchakphaakhnaadelk_current_status
      from:
        - running
        - rinsing
        - spinning
        - soaking
        - prewash
        - detecting
        - drying
      to: power_off
  condition:
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 180 }}'
  action:
    - service: notify.notify
      data:
        title: '⚠️ LG เครื่องซักผ้า: เครื่องหยุดทำงานกลางคัน!'
        message: "{% set machine = 'เครื่องซักผ้าขนาดเล็ก' if 'khnaadelk' in trigger.entity_id else 'เครื่องซักผ้าหลัก' %} {% if trigger.to_state.state == 'pause' %}\n  {{ machine }} หยุดชะงัก (Pause) ค้างเกิน 45 วินาที! หากไม่ได้กดหยุดเอง อาจเกิดจากแรงดันน้ำไม่พอ/น้ำไม่เข้า กรุณาตรวจสอบ\n{% else %}\n  {{ machine }} ดับหรือตัดการทำงานกะทันหันก่อนรอบซักเสร็จสิ้น (Power Off) กรุณาตรวจสอบ\n{% endif %}"
        data:
          push:
            sound: critical
          group: lg-washer-alert
    - service: notify.mobile_app_mooball
      data:
        title: '⚠️ LG เครื่องซักผ้า: เครื่องหยุดทำงานกลางคัน!'
