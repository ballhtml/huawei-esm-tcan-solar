        - unavailable
        - unknown
    - platform: state
      entity_id:
        - event.ekhruue_ngchakphaa_notification
        - event.ekhruue_ngchakphaakhnaadelk_notification
      attribute: event_type
      to: error_during_washing
    - platform: state
      entity_id:
        - sensor.ekhruue_ngchakphaa_current_status
        - sensor.ekhruue_ngchakphaakhnaadelk_current_status
      to: error
