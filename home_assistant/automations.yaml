- id: solar_low_battery_alert
  alias: 'Solar: แจ้งเตือนแบตเตอรี่ใกล้แตะจุดสำรองฉุกเฉิน (32%)'
  description: แจ้งเตือนเข้า HA App เมื่อแบตเตอรี่ลดลงถึง 32% พร้อมระบุเซลล์และแพ็กที่ต่ำสุด (เตือนครั้งเดียวต่อรอบ เว้นระยะ 2 ชม.)
  trigger:
    - platform: numeric_state
      entity_id: sensor.huawei_esm_battery_system_total_battery_system_soc
      below: 32.1
  condition:
    - condition: numeric_state
      entity_id: sensor.huawei_esm_battery_system_total_battery_system_soc
      above: 25
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 7200 }}'
  action:
    - service: notify.notify
      data:
        title: ⚠️ แบตเตอรี่ใกล้แตะจุดสำรองฉุกเฉิน (32%)
        message: 'แบตเตอรี่รวมเหลือ {{ states(''sensor.huawei_esm_battery_system_total_battery_system_soc'') }}% (พร้อมจ่าย {{ states(''sensor.battery_usable_energy_to_30_percent_kwh'') }} kWh) ใกล้แตะเกณฑ์ตัดสลับไปใช้ไฟหลวง (30%) เพื่อสำรอง 30% ({{ states(''sensor.battery_emergency_reserve_30_percent_kwh'') }} kWh) ไว้เผื่อไฟดับ 📍 เซลล์ต่ำสุด: {{ states(''sensor.battery_system_lowest_cell_info'') }} 📍 แพ็กต่ำสุด: {{ states(''sensor.battery_system_lowest_pack_info'') }}'
        data:
          push:
            sound: default
          group: solar-alerts
    - service: notify.mobile_app_motorola_edge_20_pro
      data:
        title: ⚠️ แบตเตอรี่ใกล้แตะจุดสำรองฉุกเฉิน (32%)
        message: 'แบตเตอรี่รวมเหลือ {{ states(''sensor.huawei_esm_battery_system_total_battery_system_soc'') }}% (พร้อมจ่าย {{ states(''sensor.battery_usable_energy_to_30_percent_kwh'') }} kWh) ใกล้แตะเกณฑ์ตัดสลับไปใช้ไฟหลวง (30%) เพื่อสำรอง 30% ({{ states(''sensor.battery_emergency_reserve_30_percent_kwh'') }} kWh) ไว้เผื่อไฟดับ 📍 เซลล์ต่ำสุด: {{ states(''sensor.battery_system_lowest_cell_info'') }} 📍 แพ็กต่ำสุด: {{ states(''sensor.battery_system_lowest_pack_info'') }}'
        data:
          push:
            sound: default
          group: solar-alerts
  mode: single
- id: solar_high_load_warning
  alias: 'Solar: แจ้งเตือนโหลดบ้านสูงเกินพิกัด (>9.5 kW)'
  description: แจ้งเตือนเข้า HA App เมื่อโหลดบ้านเกิน 9,500W ต่อเนื่อง 30 วินาที เพื่อป้องกันเครื่องทริป (เว้นระยะ 15 นาที)
  trigger:
    - platform: numeric_state
      entity_id: sensor.home_energy_em11000_output_power
      above: 9500
      for:
        seconds: 30
  condition:
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 900 }}'
  action:
    - service: notify.notify
      data:
        title: 🚨 เตือนโหลดบ้านสูงเกินพิกัด (>9.5 kW)
        message: กำลังใช้ไฟ {{ (states("sensor.home_energy_em11000_output_power") | float(0) / 1000) | round(2) }} kW ใกล้ขีดจำกัดอินเวอร์เตอร์ 11kW ระวังเครื่องตัด!
        data:
          push:
            sound: critical
          group: solar-alerts
    - service: notify.mobile_app_motorola_edge_20_pro
      data:
        title: 🚨 เตือนโหลดบ้านสูงเกินพิกัด (>9.5 kW)
        message: กำลังใช้ไฟ {{ (states("sensor.home_energy_em11000_output_power") | float(0) / 1000) | round(2) }} kW ใกล้ขีดจำกัดอินเวอร์เตอร์ 11kW ระวังเครื่องตัด!
        data:
          push:
            sound: critical
          group: solar-alerts
  mode: single
- id: solar_battery_imbalance_temp_alert
  alias: 'Solar: แจ้งเตือนสุขภาพแบตเตอรี่ระบุแพ็กและเซลล์'
  description: แจ้งเตือนเมื่อตรวจพบความต่างแรงดันสูง หรืออุณหภูมิสูง พร้อมระบุแพ็กและเซลล์ที่ผิดปกติ (เว้นระยะ 2 ชม.)
  trigger:
    - platform: numeric_state
      entity_id: sensor.battery_system_voltage_delta
      above: 1.1
      for:
        minutes: 5
    - platform: numeric_state
      entity_id: sensor.battery_system_cell_voltage_delta_mv
      above: 150
      for:
        minutes: 5
    - platform: numeric_state
      entity_id: sensor.huawei_esm_battery_system_max_battery_cell_temperature
      above: 48
      for:
        minutes: 3
  condition:
    - condition: template
      value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 7200 }}'
  action:
    - choose:
        # กรณีที่ 1: อุณหภูมิสูงเกิน 48 องศา
        - conditions:
            - condition: numeric_state
              entity_id: sensor.huawei_esm_battery_system_max_battery_cell_temperature
              above: 48
          sequence:
            - service: notify.notify
              data:
                title: '🔥 แจ้งเตือนอุณหภูมิตู้แบตเตอรี่สูง!'
                message: >-
                  ตรวจพบอุณหภูมิแบตเตอรี่สูงเกินเกณฑ์:
                  🌡️ {{ states('sensor.battery_system_warmest_pack_info') }}
                  กรุณาตรวจสอบการระบายอากาศหรือพัดลมในตู้แบตเตอรี่
                data:
                  push:
                    sound: default
                  group: solar-alerts

        # กรณีที่ 2: แบตเตอรี่ใกล้เต็ม (SOC > 88% หรือ V > 52.0V) -> Top-Balancing ปกติ
        - conditions:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.huawei_esm_battery_system_total_battery_system_soc
                  above: 88
                - condition: numeric_state
                  entity_id: sensor.home_energy_em11000_battery_voltage
                  above: 52.0
          sequence:
            - service: notify.notify
              data:
                title: '🔋 แบตเตอรี่ใกล้เต็ม: ระบบกำลังทำ Top-Balancing (สถานะปกติ)'
                message: >-
                  แบตเตอรี่ชาร์จขึ้นมาถึง {{ states('sensor.huawei_esm_battery_system_total_battery_system_soc') }}% ({{ states('sensor.home_energy_em11000_battery_voltage') }}V):
                  เซลล์แตะช่วงหัวกราฟและดีดตัวตามธรรมชาติ:
                  🔵 เซลล์สูงสุด: {{ states('sensor.battery_system_highest_cell_info') }}
                  🔴 เซลล์ต่ำสุด: {{ states('sensor.battery_system_lowest_cell_info') }}
                  ⚡ ผลต่างเซลล์: {{ states('sensor.battery_system_cell_voltage_delta_mv') }} mV
                  ✅ ระบบได้ปรับลดกระแสชาร์จลงอัตโนมัติเพื่อเกลี่ยเซลล์ ไม่มีความเสี่ยง สบายใจได้ครับ
                data:
                  push:
                    sound: default
                  group: solar-status

      # กรณีที่ 3: ผิดปกติจริงขณะใช้งานทั่วไป (SOC < 88% แต่เซลล์ต่างกันเยอะ)
      default:
        - service: notify.notify
          data:
            title: '⚠️ แจ้งเตือนความผิดปกติ: เซลล์ไม่บาลานซ์ช่วงใช้งาน'
            message: >-
              ตรวจพบเซลล์ต่างกันเกินเกณฑ์ปกติขณะแบตยังไม่เต็ม (SOC {{ states('sensor.huawei_esm_battery_system_total_battery_system_soc') }}%):
              🔴 เซลล์ต่ำสุด: {{ states('sensor.battery_system_lowest_cell_info') }}
              🔵 เซลล์สูงสุด: {{ states('sensor.battery_system_highest_cell_info') }}
              ⚡ ผลต่างเซลล์: {{ states('sensor.battery_system_cell_voltage_delta_mv') }} mV
              📦 แพ็กต่ำสุด: {{ states('sensor.battery_system_lowest_pack_info') }}
              📦 แพ็กสูงสุด: {{ states('sensor.battery_system_highest_pack_info') }} (ΔV {{ states('sensor.battery_system_voltage_delta') }}V)
              แนะนำให้ตรวจสอบการขันขั้วต่อหรือเช็คสุขภาพเซลล์
            data:
              push:
                sound: default
              group: solar-alerts
  mode: single
- id: solar_daily_energy_cost_summary_log
  alias: 'Solar: สรุปยอดประหยัดไฟและพลังงานประจำวัน (23:59)'
  description: บันทึกและส่งรายงานสรุปยอดผลิตโซลาร์ การใช้ไฟบ้าน และเงินที่ประหยัดได้จริงประจำวัน เข้ามือถือและเก็บบันทึกประวัติ
  trigger:
    - platform: time
      at: '23:59:00'
  action:
    - service: notify.notify
      data:
        title: 📊 สรุปยอดพลังงานและเงินประจำวัน ({{ now().strftime("%d/%m/%Y") }})
        message: '☀️ โซลาร์ผลิตวันนี้: {{ states(''sensor.home_energy_em11000_energy_today'') }} kWh (ชาร์จเก็บลงแบต {{ states(''sensor.home_energy_em11000_day_battery_charge'') }} kWh / จ่ายออกแบต {{ states(''sensor.home_energy_em11000_day_battery_discharge'') }} kWh) 🏠 ไฟที่บ้านใช้รวม: {{ states(''sensor.house_energy_daily'') }} kWh (มูลค่า ฿{{ states(''sensor.house_cost_today'') }}) ⚡ ดึงไฟหลวง (PEA): {{ states(''sensor.grid_energy_daily'') }} kWh (จ่าย ฿{{ states(''sensor.grid_cost_today'') }}) 💰 โซลาร์+แบตจ่ายช่วยบ้านจริง: {{ states(''sensor.solar_load_offset_today_kwh'') }} kWh (ประหยัด ฿{{ states(''sensor.net_solar_savings_today'') }})'
        data:
          push:
            sound: default
          group: solar-daily-summary
    - service: persistent_notification.create
      data:
        notification_id: daily_summary_{{ now().strftime("%Y%m%d") }}
        title: '📊 สรุปยอดประจำวัน: {{ now().strftime("%d/%m/%Y") }}'
        message: '- **โซลาร์ผลิตวันนี้:** {{ states(''sensor.home_energy_em11000_energy_today'') }} kWh *(ชาร์จเก็บลงแบต {{ states(''sensor.home_energy_em11000_day_battery_charge'') }} kWh / มูลค่าสำรอง ฿{{ states(''sensor.solar_stored_in_battery_value_today'') }})* - **บ้านใช้ไฟรวม:** {{ states(''sensor.house_energy_daily'') }} kWh (มูลค่า **฿{{ states(''sensor.house_cost_today'') }}**) - **ดึงไฟหลวง PEA:** {{ states(''sensor.grid_energy_daily'') }} kWh (จ่าย **฿{{ states(''sensor.grid_cost_today'') }}**) - **โซลาร์+แบตจ่ายช่วยบ้านจริง:** {{ states(''sensor.solar_load_offset_today_kwh'') }} kWh (ประหยัด **฿{{ states(''sensor.net_solar_savings_today'') }}**)'
  mode: single
- id: solar_monthly_billing_cycle_summary_log
  alias: 'Solar: สรุปยอดตัดรอบบิลประจำเดือน (วันที่ 19 เวลา 23:59 ก่อนตัดรอบ 20)'
  description: บันทึกและส่งรายงานสรุปยอดรอบบิลประจำเดือน (ตัดรอบวันที่ 20) เข้ามือถือและเก็บบันทึกประวัติ
  trigger:
    - platform: time
      at: '23:59:00'
  condition:
    - condition: template
      value_template: '{{ now().day == 19 }}'
  action:
    - service: notify.notify
      data:
        title: 🏆 สรุปยอดตัดรอบบิลโซลาร์ประจำเดือน (รอบบิลวันที่ 20)
        message: 'สรุปยอดรอบบิลสิ้นสุด {{ now().strftime("%d/%m/%Y") }}: ☀️ โซลาร์ผลิตสะสม: {{ states(''sensor.solar_energy_billing_cycle'') }} kWh 🏠 ไฟที่บ้านใช้รวม: {{ states(''sensor.house_energy_billing_cycle'') }} kWh (มูลค่า ฿{{ states(''sensor.house_cost_billing_cycle'') }}) ⚡ ดึงไฟหลวง (PEA): {{ states(''sensor.grid_energy_billing_cycle'') }} kWh (สะสม ฿{{ states(''sensor.grid_cost_billing_cycle'') }} | จ่ายสุทธิ ฿{{ states(''sensor.grid_cost_billing_cycle_pea_net'') }}) 💰 โซลาร์+แบตจ่ายช่วยบ้านจริง: {{ states(''sensor.solar_load_offset_billing_cycle_kwh'') }} kWh (ประหยัด ฿{{ states(''sensor.net_solar_savings_billing_cycle'') }})'
        data:
          push:
            sound: default
          group: solar-monthly-summary
    - service: persistent_notification.create
      data:
        notification_id: monthly_summary_{{ now().strftime("%Y%m") }}
        title: 🏆 สรุปยอดรอบบิล {{ now().strftime("%B %Y") }}
        message: 'สรุปยอดรอบบิลสิ้นสุด {{ now().strftime("%d/%m/%Y") }}: - **โซลาร์ผลิตสะสม:** {{ states(''sensor.solar_energy_billing_cycle'') }} kWh - **บ้านใช้ไฟรวม:** {{ states(''sensor.house_energy_billing_cycle'') }} kWh (มูลค่า **฿{{ states(''sensor.house_cost_billing_cycle'') }}**) - **ดึงไฟหลวง PEA:** {{ states(''sensor.grid_energy_billing_cycle'') }} kWh (สะสม **฿{{ states(''sensor.grid_cost_billing_cycle'') }}** | จ่ายสุทธิ **฿{{ states(''sensor.grid_cost_billing_cycle_pea_net'') }}**) - **โซลาร์+แบตจ่ายช่วยบ้านจริง:** {{ states(''sensor.solar_load_offset_billing_cycle_kwh'') }} kWh (ประหยัด **฿{{ states(''sensor.net_solar_savings_billing_cycle'') }}**)'
  mode: single
- id: solar_operating_mode_change_summary
  alias: 'Solar: บันทึกและสรุปยอดไฟทุกครั้งที่สลับโหมด (SUB ↔ SBU)'
  description: แจ้งเตือนและบันทึกยอดใช้ไฟจาก Grid รายวัน + ยอดสะสมทบรอบบิล ทุกครั้งที่อินเวอร์เตอร์สลับโหมดการทำงาน
  trigger:
    - platform: state
      entity_id: sensor.home_energy_em11000_operating_mode
      from:
        - Grid Mode
        - Off-grid Mode
      to:
        - Grid Mode
        - Off-grid Mode
  action:
    - service: notify.notify
      data:
        title: '🔄 สลับโหมดอินเวอร์เตอร์: {{ trigger.from_state.state }} ➔ {{ trigger.to_state.state }}'
        message: 'เวลาสลับโหมด: {{ now().strftime("%H:%M น.") }} ({{ states(''sensor.home_energy_em11000_main_output_priority'') }}) ⚡ ดึงไฟหลวงวันนี้ (สะสม): {{ states(''sensor.grid_energy_daily'') }} kWh (จ่าย ฿{{ states(''sensor.grid_cost_today'') }}) 🔋 โซลาร์+แบตช่วยบ้านวันนี้: {{ states(''sensor.solar_load_offset_today_kwh'') }} kWh (ประหยัด ฿{{ states(''sensor.net_solar_savings_today'') }}) 📅 สะสมทบรอบบิลนี้ (ตั้งแต่ 20): {{ states(''sensor.grid_energy_billing_cycle'') }} kWh (สะสม ฿{{ states(''sensor.grid_cost_billing_cycle'') }} | จ่ายสุทธิ PEA ฿{{ states(''sensor.grid_cost_billing_cycle_pea_net'') }})'
        data:
          push:
            sound: default
          group: solar-mode-switch
    - service: persistent_notification.create
      data:
        notification_id: mode_switch_{{ now().strftime("%Y%m%d_%H%M%S") }}
        title: '🔄 สลับโหมด ({{ now().strftime("%H:%M น.") }}): {{ trigger.from_state.state }} ➔ {{ trigger.to_state.state }}'
        message: '- **โหมดปัจจุบัน:** {{ trigger.to_state.state }} ({{ states(''sensor.home_energy_em11000_main_output_priority'') }}) - **แบตเตอรี่คงเหลือ:** {{ states(''sensor.huawei_esm_battery_system_total_battery_system_soc'') }}% ({{ (states(''sensor.battery_remaining_energy_wh'') | float(0) / 1000) | round(2) }} kWh) - **ดึงไฟหลวงวันนี้ (บวกทบทุกครั้งที่ใช้ Grid):** {{ states(''sensor.grid_energy_daily'') }} kWh (จ่าย **฿{{ states(''sensor.grid_cost_today'') }}**) - **โซลาร์+แบตช่วยบ้านวันนี้:** {{ states(''sensor.solar_load_offset_today_kwh'') }} kWh (ประหยัด **฿{{ states(''sensor.net_solar_savings_today'') }}**) - **สะสมทบรอบบิลนี้ (ตั้งแต่วันที่ 20):** {{ states(''sensor.grid_energy_billing_cycle'') }} kWh (สะสม **฿{{ states(''sensor.grid_cost_billing_cycle'') }}** | หักส่วนลดสิทธิ G1 เหลือ **฿{{ states(''sensor.grid_cost_billing_cycle_pea_net'') }}**)'
  mode: queued
- id: quant_bot_webhook_alert
  alias: 'Quant Bot: แจ้งเตือนการเทรด MT5 & Crypto พร้อมปุ่มควบคุมบนมือถือ (เฉพาะ Ball)'
  description: รับสัญญาณจาก MT5 EA หรือ Crypto Bot บน NAS แล้วส่งแจ้งเตือนเข้าเฉพาะอุปกรณ์ของ Ball (MooBall & iPad MooBall) ไม่รบกวนบัญชีอื่น
  trigger:
    - platform: webhook
      webhook_id: mt5_quant_bot
      allowed_methods:
        - POST
        - PUT
      local_only: false
  action:
    - service: notify.mobile_app_mooball
      data:
        title: '{{ trigger.json.title | default("🤖 Pstack Quant Trading Bot") }}'
        message: '{{ trigger.json.message | default("มีการอัปเดตสถานะจากบอทเทรด") }}'
        data:
          push:
            sound: default
          group: quant-trading-bot
          actions:
            - action: QUANT_BOT_SCAN_NOW
              title: 📊 สแกนตลาดตอนนี้
            - action: QUANT_BOT_PAUSE
              title: ⏸️ พักบอทชั่วคราว
            - action: QUANT_BOT_PANIC_CLOSE
              title: 🚨 ปิดทุกไม้ฉุกเฉิน!
              destructive: true
    - service: notify.mobile_app_ipad_mooball
      data:
        title: '{{ trigger.json.title | default("🤖 Pstack Quant Trading Bot") }}'
        message: '{{ trigger.json.message | default("มีการอัปเดตสถานะจากบอทเทรด") }}'
        data:
          push:
            sound: default
          group: quant-trading-bot
          actions:
            - action: QUANT_BOT_SCAN_NOW
              title: 📊 สแกนตลาดตอนนี้
            - action: QUANT_BOT_PAUSE
              title: ⏸️ พักบอทชั่วคราว
            - action: QUANT_BOT_PANIC_CLOSE
              title: 🚨 ปิดทุกไม้ฉุกเฉิน!
              destructive: true
  mode: queued
- id: quant_bot_mobile_action_handler
  alias: 'Quant Bot: รับคำสั่งจากปุ่มกดแจ้งเตือนบนมือถือ (Pause / Close All / Scan)'
  description: ส่งคำสั่งจากปุ่มแจ้งเตือนบนมือถือกลับไปยังบอทบน NAS และ MT5 ผ่าน MQTT
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
  condition:
    - condition: template
      value_template: '{{ trigger.event.data.action in ["QUANT_BOT_SCAN_NOW", "QUANT_BOT_PAUSE", "QUANT_BOT_PANIC_CLOSE"] }}'
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: '{{ trigger.event.data.action == "QUANT_BOT_PAUSE" }}'
          sequence:
            - service: mqtt.publish
              data:
                topic: quant/bot_01/cmd/auto_trading
                payload: 'OFF'
                qos: 1
                retain: true
        - conditions:
            - condition: template
              value_template: '{{ trigger.event.data.action == "QUANT_BOT_PANIC_CLOSE" }}'
          sequence:
            - service: mqtt.publish
              data:
                topic: quant/bot_01/cmd/panic_close
                payload: PRESS
                qos: 1
        - conditions:
            - condition: template
              value_template: '{{ trigger.event.data.action == "QUANT_BOT_SCAN_NOW" }}'
          sequence:
            - service: mqtt.publish
              data:
                topic: quant/bot_01/cmd/scan_now
                payload: PRESS
                qos: 1
  mode: queued
