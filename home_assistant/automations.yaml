- id: lg_washer_error_alert
  alias: 'LG เครื่องซักผ้า: แจ้งเตือนข้อผิดพลาด Error (เน้นเตือนน้ำไม่เข้า/แรงดันน้ำตก IE)'
  description: แจ้งเตือนด่วนพร้อมเสียง Critical เมื่อเครื่องซักผ้ารายงาน Error โดยเฉพาะปัญหาแรงดันน้ำตก/น้ำไม่เข้า (IE), ท่อตัน, ประตูเปิด, ถังแกว่ง
