- id: 'one_shot_battery_recovery_end_0632'
  alias: 'Solar: จบการชาร์จแบตฟื้นฟูตอนกลางคืน (06:32 น.)'
  description: 'รันครั้งเดียวเวลา 06:32 น. เพื่อปิด Secondary Priority ปรับกลับเป็น SBU และ OSO สำหรับแดดตอนเช้า แล้วส่งสรุป Notification และปิดการทำงานตัวเอง'
  trigger:
    - platform: time
      at: '06:32:00'
  action:
    - service: select.select_option
      target:
        entity_id: select.home_energy_em11000_secondary_output_priority
      data:
        option: 'OFF'
    - delay: '00:00:25'
    - service: select.select_option
      target:
        entity_id: select.home_energy_em11000_secondary_charging_priority
      data:
        option: 'OFF'
    - delay: '00:00:25'
    - service: select.select_option
      target:
        entity_id: select.home_energy_em11000_charger_source_priority
      data:
        option: 'OSO'
    - delay: '00:00:25'
    - service: select.select_option
      target:
        entity_id: select.home_energy_em11000_main_output_priority
      data:
        option: 'SBU'
    - service: notify.notify
      data:
        title: '☀️ EM11000: สรุปผลการชาร์จฟื้นฟูแบตเตอรี่ (06:32 น.)'
        message: >-
          ✅ สลับกลับโหมดปกติเรียบร้อย:
          - Secondary Schedule: ปิด OFF ทั้ง Output และ Charge
          - Inverter Mode: Main SBU + OSO (แดดชาร์จเท่านั้น)
          
          🔋 ข้อมูลแบตเตอรี่ล่าสุด (06:32 น.):
          - SOC รวม 8 แพ็ก: {{ states('sensor.huawei_esm_battery_system_total_battery_system_soc') }}%
          - ความจุคงเหลือ: {{ states('sensor.huawei_esm_battery_system_total_battery_system_remaining_capacity') }} Ah
          - แรงดันแบตเตอรี่: {{ states('sensor.huawei_esm_battery_system_total_battery_system_voltage') }} V
          - สถานะเครื่อง: {{ states('sensor.home_energy_em11000_operating_mode') }}
        data:
          push:
            sound: default
          group: solar-recovery-report
    - service: persistent_notification.create
      data:
        notification_id: 'solar_battery_recovery_end_0632'
        title: '☀️ สรุปจบการชาร์จฟื้นฟูแบตเตอรี่ EM11000 (06:32)'
        message: >-
          - **สถานะ:** ปิด Secondary Schedule เรียบร้อย และตั้ง Main SBU + OSO
          - **Huawei Bank SOC:** {{ states('sensor.huawei_esm_battery_system_total_battery_system_soc') }}%
          - **ความจุคงเหลือ:** {{ states('sensor.huawei_esm_battery_system_total_battery_system_remaining_capacity') }} Ah
          - **แรงดันระบบ:** {{ states('sensor.huawei_esm_battery_system_total_battery_system_voltage') }} V
    - service: automation.turn_off
      target:
        entity_id:
          - automation.solar_cchbkaarchaarcchaebtfuuenfuut_nklaangkhuuen_06_32_n
  mode: single

- id: 'system_weekly_recorder_purge_repack'
  alias: 'System: Weekly Database Auto-Purge & Repack'
  description: 'Shrinks SQLite home-assistant_v2.db every Sunday at 04:30 AM to reclaim disk space'
  trigger:
    - platform: time
      at: '04:30:00'
  condition:
    - condition: time
      weekday:
        - sun
  action:
    - action: recorder.purge
      data:
        keep_days: 3
        repack: true
  mode: single
