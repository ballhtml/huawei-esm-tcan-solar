    modbus_controller_id: huawei_esm_pack1
    name: "Pack 1 Min Cell Temperature"
    id: pack1_min_cell_temp
    register_type: holding
    address: 0x0006
    value_type: S_WORD
    accuracy_decimals: 0
    unit_of_measurement: "°C"
    device_class: temperature
