    modbus_controller_id: huawei_esm_pack1
    name: "Pack 1 Cell 01 Voltage"
    id: pack1_cell_01_voltage
    register_type: holding
    address: 0x0022
    value_type: U_WORD
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.001
  - platform: modbus_controller
    modbus_controller_id: huawei_esm_pack1
    name: "Pack 1 Cell 02 Voltage"
    id: pack1_cell_02_voltage
    register_type: holding
    address: 0x0023
    value_type: U_WORD
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.001
  - platform: modbus_controller
    modbus_controller_id: huawei_esm_pack1
    name: "Pack 1 Cell 03 Voltage"
    id: pack1_cell_03_voltage
    register_type: holding
    address: 0x0024
    value_type: U_WORD
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.001
  - platform: modbus_controller
    modbus_controller_id: huawei_esm_pack1
    name: "Pack 1 Cell 04 Voltage"
    id: pack1_cell_04_voltage
    register_type: holding
