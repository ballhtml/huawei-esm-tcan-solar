# ==============================================================================
# ESPHome Configuration for LILYGO T-CAN485 + Huawei ESM-48100B1 BMS (6-Pack Ready)
# Version: 6.3.0 Enterprise (Green Activity Pulse LED with Instant Transition)
# ==============================================================================

esphome:
  name: tcanesm
  friendly_name: "Huawei ESM Battery System"
  build_path: C:\esphome_build\tcanesm
  platformio_options:
    build_flags:
      - "-mlongcalls"
  on_boot:
    priority: -10
    then:
      - switch.turn_on: rs485_power
      - switch.turn_on: rs485_chip_enable
      - switch.turn_on: rs485_autodirection
      - lambda: |-
          struct ModbusAccessor : public esphome::modbus::Modbus {
            void set_delays(uint16_t frame_delay, uint16_t long_delay) {
              this->frame_delay_ms_ = frame_delay;
              this->long_rx_buffer_delay_ms_ = long_delay;
            }
          };
          static_cast<ModbusAccessor *>(modbus_bms)->set_delays(250, 350);
          static_cast<ModbusAccessor *>(modbus_pack4)->set_delays(250, 350);
          ESP_LOGI("bms_init", "Modbus frame_delay set to 250ms, long_rx_delay set to 350ms for both buses");
      - light.turn_on:
          id: board_status_led
          red: 0.0
          green: 1.0
          blue: 0.0
          brightness: 100%
          transition_length: 0s
      - delay: 1000ms
      - light.turn_off:
          id: board_status_led
          transition_length: 0s
      - script.execute: modbus_polling_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      CONFIG_FATFS_VOLUME_COUNT: "2"
    advanced:
      include_builtin_idf_components:
        - fatfs
        - wear_levelling
        - sdmmc

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  manual_ip:
    static_ip: 192.168.8.108
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1
    dns2: 8.8.8.8
  power_save_mode: NONE
  ap:
    ssid: "tcanesm-ap"
    password: "bms_setup_password"

captive_portal:

web_server:
  port: 80

# Native Home Assistant API - Instant Auto-Discovery in Home Assistant
api:
  reboot_timeout: 0s

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: components_v4

logger:
  level: DEBUG
  baud_rate: 0

# ------------------------------------------------------------------------------
# UART & Modbus Configuration (Isolated Port 1 - Hardware FIFO & Input Pullup)
# ------------------------------------------------------------------------------
uart:
  - id: uart_modbus
    tx_pin: GPIO22
    rx_pin:
      number: GPIO21
      mode: INPUT_PULLUP
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    rx_timeout: 90
    rx_buffer_size: 512

  # Port 2 (Red Module on GPIO18/25) for Pack 4 (Isolated Bus)
  - id: uart_pack4
    tx_pin: GPIO18
    rx_pin:
      number: GPIO25
      mode: INPUT_PULLUP
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    rx_timeout: 90
    rx_buffer_size: 512

  # Port 3 (GPIO33/32) Connected to Packs 1, 2, 3 (Isolated Module)
  - id: uart_inverter
    tx_pin: GPIO33
    rx_pin:
      number: GPIO32
      mode: INPUT_PULLUP
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    rx_timeout: 90
    rx_buffer_size: 512


# ------------------------------------------------------------------------------
# CAN-Bus (TWAI 500kbps) Transmitter: ส่งข้อมูล Battery System ไปหา Board 2
# ------------------------------------------------------------------------------
canbus:
  - platform: esp32_can
    id: interconnect_can_bus
    tx_pin: GPIO27
    rx_pin: GPIO26
    can_id: 0
    bit_rate: 500kbps

interval:
  - interval: 2000ms
    then:
      - lambda: |-
          float soc = id(total_battery_system_soc).state;
          float v = id(total_battery_system_voltage).state;
          float i = id(total_battery_system_current).state;
          float temp = id(max_battery_cell_temp).state;

          if (isnan(soc) || isnan(v) || isnan(i) || isnan(temp)) return;

          // 0x355: SOC & SOH
          uint16_t soc_val = (uint16_t)soc;
          uint16_t soh_val = 100;
          std::vector<uint8_t> d355 = {
            (uint8_t)(soc_val & 0xFF), (uint8_t)((soc_val >> 8) & 0xFF),
            (uint8_t)(soh_val & 0xFF), (uint8_t)((soh_val >> 8) & 0xFF)
          };
          id(interconnect_can_bus).send_data(0x355, false, d355);

          // 0x356: Voltage (0.01V), Current (0.1A signed), Temp (0.1°C signed)
          int16_t v_100 = (int16_t)(v * 100.0f);
          int16_t i_10 = (int16_t)(i * 10.0f);
          int16_t t_10 = (int16_t)(temp * 10.0f);
          std::vector<uint8_t> d356 = {
            (uint8_t)(v_100 & 0xFF), (uint8_t)((v_100 >> 8) & 0xFF),
            (uint8_t)(i_10 & 0xFF), (uint8_t)((i_10 >> 8) & 0xFF),
            (uint8_t)(t_10 & 0xFF), (uint8_t)((t_10 >> 8) & 0xFF)
          };
          id(interconnect_can_bus).send_data(0x356, false, d356);

modbus:
  - id: modbus_bms
    uart_id: uart_inverter
    send_wait_time: 1500ms
    turnaround_time: 80ms

  - id: modbus_pack4
    uart_id: uart_pack4
    send_wait_time: 1500ms
    turnaround_time: 80ms

# ------------------------------------------------------------------------------
# Modbus Controllers — 6 Packs (Slave IDs 214 - 219)
# ------------------------------------------------------------------------------
modbus_controller:
  - id: huawei_esm_pack1
    modbus_id: modbus_bms
    address: 214
    update_interval: never
    command_throttle: 300ms
    max_cmd_retries: 2
    setup_priority: -10
  - id: huawei_esm_pack2
    modbus_id: modbus_bms
    address: 215
    update_interval: never
    command_throttle: 300ms
    max_cmd_retries: 2
    setup_priority: -10
  - id: huawei_esm_pack3
    modbus_id: modbus_bms
    address: 216
    update_interval: never
    command_throttle: 300ms
    max_cmd_retries: 2
    setup_priority: -10
  - id: huawei_esm_pack4
    modbus_id: modbus_pack4
    address: 214
    update_interval: never
    command_throttle: 300ms
    max_cmd_retries: 2
    setup_priority: -10
  - id: huawei_esm_pack5
    modbus_id: modbus_bms
    address: 217
    update_interval: never
    command_throttle: 300ms
    max_cmd_retries: 2
    setup_priority: -10
  - id: huawei_esm_pack6
    modbus_id: modbus_bms
    address: 218
    update_interval: never
    command_throttle: 300ms
    max_cmd_retries: 2
    setup_priority: -10
# ------------------------------------------------------------------------------
# Hardware Switches & Pack Active Toggles (Home Assistant Controllable)
# ------------------------------------------------------------------------------
switch:
  - platform: gpio
    pin: {number: GPIO16, inverted: false}
    id: rs485_power
    name: "RS485 Power Enable"
    restore_mode: ALWAYS_ON

  - platform: gpio
    pin: {number: GPIO19, inverted: false}
    id: rs485_chip_enable
    name: "RS485 Chip Enable"
    restore_mode: ALWAYS_ON

  - platform: gpio
    pin: {number: GPIO17, inverted: false}
    id: rs485_autodirection
    name: "RS485 Auto Direction Enable"
    restore_mode: ALWAYS_ON


  - platform: template
    name: "Pack 1 Monitor Enable"
    id: pack1_monitor
    icon: "mdi:battery-sync"
    optimistic: true
    restore_mode: ALWAYS_ON
  - platform: template
    name: "Pack 2 Monitor Enable"
    id: pack2_monitor
    icon: "mdi:battery-sync"
    optimistic: true
    restore_mode: ALWAYS_ON
  - platform: template
    name: "Pack 3 Monitor Enable"
    id: pack3_monitor
    icon: "mdi:battery-sync"
    optimistic: true
    restore_mode: ALWAYS_ON
  - platform: template
    name: "Pack 4 Monitor Enable"
    id: pack4_monitor
    icon: "mdi:battery-sync"
    optimistic: true
    restore_mode: ALWAYS_ON
  - platform: template
    name: "Pack 5 Monitor Enable"
    id: pack5_monitor
    icon: "mdi:battery-sync"
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Pack 6 Monitor Enable"
    id: pack6_monitor
    icon: "mdi:battery-sync"
    optimistic: true
    restore_mode: ALWAYS_OFF
# ------------------------------------------------------------------------------
# Onboard Status LED (WS2812 RGB LED)
# ------------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO04
    num_leds: 1
    name: "Board Status LED"
    id: board_status_led
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF


# ------------------------------------------------------------------------------
# SNTP Real-Time Clock (Asia/Bangkok) for Daily Log Rotation & Timestamping
# ------------------------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - time.google.com

# ------------------------------------------------------------------------------
# MicroSD Card Data Logger & Wi-Fi Download Server (LilyGO T-CAN485 TF Slot)
# ------------------------------------------------------------------------------
sd_logger:
  id: sd_card_logger
  time_id: sntp_time
  update_interval: 10s
  cs_pin: 13
  mosi_pin: 15
  miso_pin: 2
  clk_pin: 14
  http_port: 8080
  voltage_sensor: total_battery_system_voltage
  current_sensor: total_battery_system_current
  power_sensor: total_battery_system_power
  soc_sensor: total_battery_system_soc
  temp_sensor: max_battery_cell_temp
  pack1_soc: pack1_state_of_charge
  pack1_v: pack1_battery_voltage
  pack1_i: pack1_current
  pack2_soc: pack2_state_of_charge
  pack2_v: pack2_battery_voltage
  pack2_i: pack2_current
  pack3_soc: pack3_state_of_charge
  pack3_v: pack3_battery_voltage
  pack3_i: pack3_current
  pack4_soc: pack4_state_of_charge
  pack4_v: pack4_battery_voltage
  pack4_i: pack4_current
  inverter_queries: inverter_query_count


# ------------------------------------------------------------------------------
# Time-Division Multiplexing Polling Engine + Activity Blink Script
# ------------------------------------------------------------------------------
script:
  - id: flash_activity_led
    mode: restart
    then:
      - light.turn_on:
          id: board_status_led
          red: 0.0
          green: 1.0
          blue: 0.0
          brightness: 100%
          transition_length: 0s
      - delay: 80ms
      - light.turn_off:
          id: board_status_led
          transition_length: 0s

  - id: modbus_polling_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - if:
                condition:
                  lambda: 'return id(pack1_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack1).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack2_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack2).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack3_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack3).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack4_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack4).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack5_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack5).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack6_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack6).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - delay: 1000ms

  # --- ESN/BarCode Reader for Pack 4 (Isolated Bus on uart_pack4, Slave ID 0xD6) ---
  - id: read_esn_pack4
    mode: single
    then:
      - script.stop: modbus_polling_loop
      - delay: 2000ms
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 4 (0xD6 on uart_pack4) ==="
      # Step 1: UploadStartCommand
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x05, 0x01, 0x04, 0x69, 0xBC]
      - delay: 1000ms
      # Step 2: UploadDataCommand Block 0
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x6A, 0x59]
      - delay: 1000ms
      # Step 3: UploadDataCommand Block 1
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0xAB, 0x99]
      - delay: 1000ms
      # Step 4: UploadDataFinish
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x0C, 0x01, 0x04, 0xB9, 0xBE]
      - delay: 1500ms
      - logger.log:
          level: WARN
          format: ">>> ESN READ: Pack 4 read complete!"
      - script.execute: modbus_polling_loop

  # --- ESN/BarCode Reader for ALL Packs ---
  - id: read_esn_all
    mode: single
    then:
      - script.stop: modbus_polling_loop
      - delay: 2000ms
      # ==================== PACK 4 (uart_pack4, 0xD6) ====================
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 4 (0xD6 on uart_pack4) ==="
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x05, 0x01, 0x04, 0x69, 0xBC]
      - delay: 1000ms
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x6A, 0x59]
      - delay: 1000ms
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0xAB, 0x99]
      - delay: 1000ms
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x0C, 0x01, 0x04, 0xB9, 0xBE]
      - delay: 1500ms
      # ==================== PACK 1 (uart_inverter, 0xD6) ====================
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 1 (0xD6 on uart_inverter) ==="
      - uart.write:
          id: uart_inverter
          data: [0xD6, 0x41, 0x05, 0x01, 0x04, 0x69, 0xBC]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x6A, 0x59]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0xAB, 0x99]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD6, 0x41, 0x0C, 0x01, 0x04, 0xB9, 0xBE]
      - delay: 1500ms
      # ==================== PACK 2 (uart_inverter, 0xD7) ====================
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 2 (0xD7 on uart_inverter) ==="
      - uart.write:
          id: uart_inverter
          data: [0xD7, 0x41, 0x05, 0x01, 0x04, 0x54, 0x7C]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD7, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x7A, 0x99]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD7, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0xBB, 0x59]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD7, 0x41, 0x0C, 0x01, 0x04, 0x84, 0x7E]
      - delay: 1500ms
      # ==================== PACK 3 (uart_inverter, 0xD8) ====================
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 3 (0xD8 on uart_inverter) ==="
      - uart.write:
          id: uart_inverter
          data: [0xD8, 0x41, 0x05, 0x01, 0x04, 0x00, 0x7D]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD8, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x85, 0x99]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD8, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0x44, 0x59]
      - delay: 1000ms
      - uart.write:
          id: uart_inverter
          data: [0xD8, 0x41, 0x0C, 0x01, 0x04, 0xD0, 0x7F]
      - delay: 1500ms
      - logger.log:
          level: WARN
          format: ">>> ESN READ: All packs read complete!"
      - script.execute: modbus_polling_loop

button:
  - platform: template
    name: "Read Pack 4 ESN (BarCode)"
    id: btn_read_pack4_esn
    icon: "mdi:barcode-scan"
    on_press:
      - script.execute: read_esn_pack4

  - platform: template
    name: "Read All Packs ESN (BarCode)"
    id: btn_read_all_esn
    icon: "mdi:barcode-scan"
    on_press:
      - script.execute: read_esn_all

# ------------------------------------------------------------------------------
# Modbus Sensors — Huawei ESM-48100B1 (Pack 1 to 8 + Individual Cell Voltages)
# ------------------------------------------------------------------------------
sensor:
  # System Health Sensors
  - platform: template
    name: "ESP32 Free Heap"
    id: esp32_free_heap
    unit_of_measurement: "B"
    accuracy_decimals: 0
    icon: "mdi:memory"
    lambda: |-
      return (float)esp_get_free_heap_size();
    update_interval: 10s

  # ==================== Pack 1 (Slave ID: 214) ====================
  - platform: modbus_controller
    modbus_controller_id: huawei_esm_pack1
    name: "Pack 1 Busbar Voltage"
    id: pack1_busbar_voltage
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: huawei_esm_pack1
    name: "Pack 1 Battery Voltage"
    id: pack1_battery_voltage
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: huawei_esm_pack1
