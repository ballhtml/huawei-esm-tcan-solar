views:
  - path: default_view
    title: Home Energy
    icon: mdi:solar-power-variant
    type: masonry
    badges: []
    cards:
      # ========================================================================
      # 1. Sunsynk Comprehensive Power Flow Card
      # ========================================================================
      - type: custom:sunsynk-power-flow-card
        title: HomeBall Energy Center
        cardstyle: full
        wide: false
        large_font: true
        show_solar: true
        show_battery: true
        show_grid: true
        center_no_grid: false
        card_height: 100%
        card_width: 100%
        decimal_places: 2
        decimal_places_energy: 1
        dynamic_line_width: true
        max_line_width: 4
        min_line_width: 1
        inverter:
          modern: false
          colour: '#9e9e9e'
          autarky: energy
          model: ces-battery-box
          auto_scale: true
          three_phase: false
          navigate: ''
          label_autarky: ''
          label_ratio: ''
        battery:
          show_daily: true
          count: 1
          max_power: 11000
          soc_end_of_charge: 100
          soc_decimal_places: 1
          energy: 38400
          shutdown_soc: 15
          shutdown_soc_offgrid: 20
          auto_scale: true
          show_absolute: true
          invert_power: true
          dynamic_colour: true
          linear_gradient: true
          hide_soc: false
          animate: true
          show_remaining_energy: true
          remaining_energy_to_shutdown: true
          invert_flow: false
          animation_speed: 1
        solar:
          show_daily: true
          mppts: 2
          auto_scale: true
          dynamic_colour: false
          animation_speed: 1
          max_power: 11000
          pv1_max_power: 5500
          pv2_max_power: 5500
          pv1_name: String 1
          pv2_name: String 2
          invert_flow: false
        load:
          show_daily: false
          dynamic_icon: true
          animation_speed: 1
          essential_name: House Load
        grid:
          show_daily_buy: false
          show_daily_sell: false
          show_nonessential: false
          auto_scale: true
          invert_flow: false
        entities:
          inverter_status_59: binary_sensor.home_energy_em11000_status
          inverter_voltage_154: sensor.home_energy_em11000_output_voltage
          inverter_current_164: sensor.home_energy_em11000_output_current
          inverter_power_175: sensor.home_energy_em11000_output_power
          dc_transformer_temp_90: sensor.home_energy_em11000_inverter_temperature
          radiator_temp_91: sensor.home_energy_em11000_dc_module_temperature
          environment_temp: sensor.home_energy_em11000_pv_temperature
          load_frequency_192: sensor.home_energy_em11000_output_frequency
          essential_power: sensor.home_energy_em11000_output_power
          solar_power_185: sensor.home_energy_em11000_solar_total_power
          pv1_power_186: sensor.home_energy_em11000_pv1_power
          pv1_voltage_109: sensor.home_energy_em11000_pv1_voltage
          pv1_current_110: sensor.home_energy_em11000_pv1_current
          pv2_power_187: sensor.home_energy_em11000_pv2_power
          pv2_voltage_111: sensor.home_energy_em11000_pv2_voltage
          pv2_current_112: sensor.home_energy_em11000_pv2_current
          day_pv_energy_108: sensor.home_energy_em11000_energy_today
          total_pv_generation: sensor.home_energy_em11000_energy_total
          grid_power_169: sensor.home_energy_em11000_grid_power
          grid_ct_power_172: sensor.home_energy_em11000_grid_power
          grid_voltage: sensor.home_energy_em11000_grid_voltage
          battery_soc_184: sensor.home_energy_em11000_battery_soc
          battery_power_190: sensor.home_energy_em11000_battery_power
          battery_current_191: sensor.home_energy_em11000_battery_current
          battery_voltage_183: sensor.home_energy_em11000_battery_voltage
          battery_temp_182: sensor.huawei_esm_battery_system_pack_1_max_cell_temperature
          battery_soh: sensor.home_energy_em11000_battery_soh
          day_battery_charge_70: sensor.home_energy_em11000_day_battery_charge
          day_battery_discharge_71: sensor.home_energy_em11000_day_battery_discharge

      # ========================================================================
      # 2. Inverter Priority Control
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Inverter Priority Control
            subtitle: Maxsky EM11000 Operating Mode
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-select-card
                entity: select.home_energy_em11000_main_output_priority
                name: Output Priority
                icon: mdi:power-cycle
              - type: custom:mushroom-select-card
                entity: select.home_energy_em11000_charger_source_priority
                name: Charger Priority
                icon: mdi:battery-charging
              - type: custom:mushroom-entity-card
                entity: button.home_energy_em11000_apply_user_mode_profile
                name: Set USER Profile
                icon: mdi:tune-vertical
                icon_color: green
                tap_action:
                  action: toggle
                  confirmation:
                    text: ยืนยันการสั่งเขียนค่าพารามิเตอร์โหมด USER (15S Huawei) ไปยังอินเวอร์เตอร์ทันที?

      # ========================================================================
      # 3. Huawei ESM Battery Bank Core Metrics
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Huawei ESM Battery Bank
            subtitle: Up to 8 Packs Cluster (48V 800Ah / 38.4 kWh)
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.huawei_esm_battery_system_total_battery_system_soc
                name: Bank SOC
                icon: mdi:battery-high
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.huawei_esm_battery_system_total_battery_system_voltage
                name: Busbar Voltage
                icon: mdi:sine-wave
                icon_color: blue
              - type: custom:mushroom-entity-card
                entity: sensor.huawei_esm_battery_system_total_battery_system_current
                name: Total Current
                icon: mdi:current-dc
                icon_color: orange
              - type: custom:mushroom-entity-card
                entity: sensor.huawei_esm_battery_system_total_battery_system_power
                name: Bank Power
                icon: mdi:flash
                icon_color: amber

      # ========================================================================
      # 4. [NEW!] T-CAN485 Gateway & Inverter Bridge (Li2 Status & SD Quick Link)
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: T-CAN485 Gateway & Inverter Bridge
            subtitle: Dual-ESP32 Pylontech Li2 & MicroSD Center
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Inverter Link (Li2)
                secondary: >-
                  {% set q = states('sensor.tcan_inverter_bridge_inverter_queries_count') %}
                  {% if q not in ['unknown', 'unavailable'] and q|int(0) > 0 %}
                    Online ({{ q }} Q)
                  {% else %}
                    Active (Online)
                  {% endif %}
                icon: mdi:swap-horizontal-bold
                icon_color: green
              - type: custom:mushroom-template-card
                primary: MicroSD Logger
                secondary: 192.168.8.109:8080
                icon: mdi:sd
                icon_color: purple
                tap_action:
                  action: url
                  url_path: http://192.168.8.109:8080/
              - type: custom:mushroom-template-card
                primary: เฉลี่ยต่อเซลล์ (15S)
                secondary: >-
                  {{ (states('sensor.huawei_esm_battery_system_total_battery_system_voltage')|float(0) / 15)|round(3) }} V/Cell
                icon: mdi:scale-balance
                icon_color: blue

      # ========================================================================
      # 5. Power & Energy Balance (24 Hours Graph)
      # ========================================================================
      - type: custom:apexcharts-card
        header:
          show: true
          title: Power & Energy Balance (24 Hours)
          show_states: true
          colorize_states: true
        graph_span: 24h
        series:
          - entity: sensor.home_energy_em11000_solar_total_power
            name: Solar PV
            color: '#f39c12'
            stroke_width: 2
            type: line
          - entity: sensor.home_energy_em11000_output_power
            name: House Load
            color: '#3498db'
            stroke_width: 2
            type: line
          - entity: sensor.huawei_esm_battery_system_total_battery_system_power
            name: Battery Power
            color: '#2ecc71'
            stroke_width: 2
            type: line
          - entity: sensor.home_energy_em11000_grid_power
            name: Grid
            color: '#95a5a6'
            stroke_width: 1.5
            type: line

      # ========================================================================
      # 6. Battery Packs Real-Time Load Sharing (Clean Compact 4-Column Table)
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Battery Packs Real-Time Load Sharing
            subtitle: จัดอันดับกระแสไฟเรียลไทม์ (Active Packs)
          - type: markdown
            content: >-
              {% set packs = [
                {'num': 1, 'name': 'Pack 1', 'v': states('sensor.huawei_esm_battery_system_pack_1_battery_voltage')|float(0), 'i': states('sensor.huawei_esm_battery_system_pack_1_current')|float(0), 'soc': states('sensor.huawei_esm_battery_system_pack_1_state_of_charge'), 'en': is_state('switch.huawei_esm_battery_system_pack_1_monitor_enable', 'on')},
                {'num': 2, 'name': 'Pack 2', 'v': states('sensor.huawei_esm_battery_system_pack_2_battery_voltage')|float(0), 'i': states('sensor.huawei_esm_battery_system_pack_2_current')|float(0), 'soc': states('sensor.huawei_esm_battery_system_pack_2_state_of_charge'), 'en': is_state('switch.huawei_esm_battery_system_pack_2_monitor_enable', 'on')},
                {'num': 3, 'name': 'Pack 3', 'v': states('sensor.huawei_esm_battery_system_pack_3_battery_voltage')|float(0), 'i': states('sensor.huawei_esm_battery_system_pack_3_current')|float(0), 'soc': states('sensor.huawei_esm_battery_system_pack_3_state_of_charge'), 'en': is_state('switch.huawei_esm_battery_system_pack_3_monitor_enable', 'on')},
                {'num': 4, 'name': 'Pack 4', 'v': states('sensor.huawei_esm_battery_system_pack_4_battery_voltage')|float(0), 'i': states('sensor.huawei_esm_battery_system_pack_4_current')|float(0), 'soc': states('sensor.huawei_esm_battery_system_pack_4_state_of_charge'), 'en': is_state('switch.huawei_esm_battery_system_pack_4_monitor_enable', 'on')},
                {'num': 5, 'name': 'Pack 5', 'v': states('sensor.huawei_esm_battery_system_pack_5_battery_voltage')|float(0), 'i': states('sensor.huawei_esm_battery_system_pack_5_current')|float(0), 'soc': states('sensor.huawei_esm_battery_system_pack_5_state_of_charge'), 'en': is_state('switch.huawei_esm_battery_system_pack_5_monitor_enable', 'on')},
                {'num': 6, 'name': 'Pack 6', 'v': states('sensor.huawei_esm_battery_system_pack_6_battery_voltage')|float(0), 'i': states('sensor.huawei_esm_battery_system_pack_6_current')|float(0), 'soc': states('sensor.huawei_esm_battery_system_pack_6_state_of_charge'), 'en': is_state('switch.huawei_esm_battery_system_pack_6_monitor_enable', 'on')},
                {'num': 7, 'name': 'Pack 7', 'v': states('sensor.huawei_esm_battery_system_pack_7_battery_voltage')|float(0), 'i': states('sensor.huawei_esm_battery_system_pack_7_current')|float(0), 'soc': states('sensor.huawei_esm_battery_system_pack_7_state_of_charge'), 'en': is_state('switch.huawei_esm_battery_system_pack_7_monitor_enable', 'on')},
                {'num': 8, 'name': 'Pack 8', 'v': states('sensor.huawei_esm_battery_system_pack_8_battery_voltage')|float(0), 'i': states('sensor.huawei_esm_battery_system_pack_8_current')|float(0), 'soc': states('sensor.huawei_esm_battery_system_pack_8_state_of_charge'), 'en': is_state('switch.huawei_esm_battery_system_pack_8_monitor_enable', 'on')}
              ] %}

              {% set active = packs | selectattr('en') | rejectattr('soc', 'in', ['unknown', 'unavailable']) | list %}
              {% set sorted_discharge = active | sort(attribute='i') %}
              {% set top_pack = sorted_discharge[0] if sorted_discharge | length > 0 else none %}

              {% if top_pack and top_pack.i < -1.0 %}
              > ⚡ **ลูกที่จ่ายไฟหนักที่สุด:** **Pack {{ top_pack.num }}** (`{{ '%+.2f' | format(top_pack.i) }} A` / `{{ '%+.0f' | format(top_pack.v * top_pack.i) }} W`)
              {% elif top_pack and top_pack.i > 1.0 %}
              > 🔋 **ลูกที่รับชาร์จไฟสูงสุด:** **Pack {{ top_pack.num }}** (`{{ '%+.2f' | format(top_pack.i) }} A` / `{{ '%+.0f' | format(top_pack.v * top_pack.i) }} W`)
              {% else %}
              > 💤 **สถานะรวม:** แบตเตอรี่อยู่ในโหมดสแตนด์บาย / กระแสนิ่งสมดุล
              {% endif %}

              | # | สถานะ | กระแส (A) | กำลัง (W) | แรงดัน (V) | SOC |
              | :---: | :---: | :---: | :---: | :---: | :---: |
              {% for p in sorted_discharge %}
              {% set icon = '🥇 ' ~ p.num if loop.index == 1 else ('🥈 ' ~ p.num if loop.index == 2 else ('🥉 ' ~ p.num if loop.index == 3 else p.num)) %}
              {% set status = '🔴 จ่ายไฟหลัก' if p.i < -8.0 else ('🟠 จ่ายไฟ' if p.i < -2.0 else ('🟡 จ่ายไฟเบา' if p.i < -0.5 else ('🟢 ชาร์จ' if p.i > 1.0 else '⚪ สแตนด์บาย'))) %}
              | **{{ icon }}** | {{ status }} | **`{{ '%+.2f' | format(p.i) }} A`** | `{{ '%+.0f' | format(p.v * p.i) }} W` | `{{ '%.1f' | format(p.v) }} V` | `{{ p.soc }}%` |
              {% endfor %}

          # Current Sharing History (ApexCharts 2 Hours)
          - type: custom:apexcharts-card
            header:
              show: true
              title: Current Sharing History (2 Hours)
              show_states: true
              colorize_states: true
            graph_span: 2h
            all_series_config:
              stroke_width: 2
              type: line
            series:
              - entity: sensor.huawei_esm_battery_system_pack_1_current
                name: Pack 1
                color: '#3498db'
                stroke_width: 2
                type: line
              - entity: sensor.huawei_esm_battery_system_pack_2_current
                name: Pack 2
                color: '#9b59b6'
                stroke_width: 2
                type: line
              - entity: sensor.huawei_esm_battery_system_pack_3_current
                name: Pack 3
                color: '#e67e22'
                stroke_width: 2
                type: line
              - entity: sensor.huawei_esm_battery_system_pack_4_current
                name: Pack 4
                color: '#1abc9c'
                stroke_width: 2
                type: line
              - entity: sensor.huawei_esm_battery_system_pack_5_current
                name: Pack 5
                color: '#e74c3c'
                stroke_width: 2
                type: line
              - entity: sensor.huawei_esm_battery_system_pack_6_current
                name: Pack 6
                color: '#f1c40f'
                stroke_width: 2
                type: line
              - entity: sensor.huawei_esm_battery_system_pack_7_current
                name: Pack 7
                color: '#2ecc71'
                stroke_width: 2
                type: line
              - entity: sensor.huawei_esm_battery_system_pack_8_current
                name: Pack 8
                color: '#34495e'
                stroke_width: 2
                type: line

      # ========================================================================
      # 7. Individual Pack Details (Cards for Active Packs)
      # ========================================================================
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Individual Pack Details
            subtitle: Real-time Voltage, Current & Power Breakdown (Active Packs)
          - type: grid
            columns: 4
            square: false
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.huawei_esm_battery_system_pack_1_monitor_enable
                    state: 'on'
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_1_state_of_charge
                    state_not: unavailable
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_1_state_of_charge
                    state_not: unknown
                card:
                  type: custom:mushroom-template-card
                  primary: >-
                    Pack 1: {{ states('sensor.huawei_esm_battery_system_pack_1_state_of_charge') }}%
                  secondary: >-
                    {{ '%.1f' | format(states('sensor.huawei_esm_battery_system_pack_1_battery_voltage') | float(0)) }}V | {{ '%+.1f' | format(states('sensor.huawei_esm_battery_system_pack_1_current') | float(0)) }}A ({{ '%+.0f' | format(states('sensor.huawei_esm_battery_system_pack_1_battery_voltage')|float(0) * states('sensor.huawei_esm_battery_system_pack_1_current')|float(0)) }}W)
                  icon: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_1_current') | float(0) %}
                    {% if cur < -0.5 %}mdi:battery-arrow-down{% elif cur > 0.5 %}mdi:battery-arrow-up{% else %}mdi:battery{% endif %}
                  icon_color: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_1_current') | float(0) %}
                    {% if cur < -8 %}red{% elif cur < -1 %}orange{% elif cur > 1 %}green{% else %}blue{% endif %}
                  entity: sensor.huawei_esm_battery_system_pack_1_state_of_charge

              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.huawei_esm_battery_system_pack_2_monitor_enable
                    state: 'on'
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_2_state_of_charge
                    state_not: unavailable
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_2_state_of_charge
                    state_not: unknown
                card:
                  type: custom:mushroom-template-card
                  primary: >-
                    Pack 2: {{ states('sensor.huawei_esm_battery_system_pack_2_state_of_charge') }}%
                  secondary: >-
                    {{ '%.1f' | format(states('sensor.huawei_esm_battery_system_pack_2_battery_voltage') | float(0)) }}V | {{ '%+.1f' | format(states('sensor.huawei_esm_battery_system_pack_2_current') | float(0)) }}A ({{ '%+.0f' | format(states('sensor.huawei_esm_battery_system_pack_2_battery_voltage')|float(0) * states('sensor.huawei_esm_battery_system_pack_2_current')|float(0)) }}W)
                  icon: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_2_current') | float(0) %}
                    {% if cur < -0.5 %}mdi:battery-arrow-down{% elif cur > 0.5 %}mdi:battery-arrow-up{% else %}mdi:battery{% endif %}
                  icon_color: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_2_current') | float(0) %}
                    {% if cur < -8 %}red{% elif cur < -1 %}orange{% elif cur > 1 %}green{% else %}blue{% endif %}
                  entity: sensor.huawei_esm_battery_system_pack_2_state_of_charge

              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.huawei_esm_battery_system_pack_3_monitor_enable
                    state: 'on'
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_3_state_of_charge
                    state_not: unavailable
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_3_state_of_charge
                    state_not: unknown
                card:
                  type: custom:mushroom-template-card
                  primary: >-
                    Pack 3: {{ states('sensor.huawei_esm_battery_system_pack_3_state_of_charge') }}%
                  secondary: >-
                    {{ '%.1f' | format(states('sensor.huawei_esm_battery_system_pack_3_battery_voltage') | float(0)) }}V | {{ '%+.1f' | format(states('sensor.huawei_esm_battery_system_pack_3_current') | float(0)) }}A ({{ '%+.0f' | format(states('sensor.huawei_esm_battery_system_pack_3_battery_voltage')|float(0) * states('sensor.huawei_esm_battery_system_pack_3_current')|float(0)) }}W)
                  icon: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_3_current') | float(0) %}
                    {% if cur < -0.5 %}mdi:battery-arrow-down{% elif cur > 0.5 %}mdi:battery-arrow-up{% else %}mdi:battery{% endif %}
                  icon_color: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_3_current') | float(0) %}
                    {% if cur < -8 %}red{% elif cur < -1 %}orange{% elif cur > 1 %}green{% else %}blue{% endif %}
                  entity: sensor.huawei_esm_battery_system_pack_3_state_of_charge

              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.huawei_esm_battery_system_pack_4_monitor_enable
                    state: 'on'
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_4_state_of_charge
                    state_not: unavailable
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_4_state_of_charge
                    state_not: unknown
                card:
                  type: custom:mushroom-template-card
                  primary: >-
                    Pack 4: {{ states('sensor.huawei_esm_battery_system_pack_4_state_of_charge') }}%
                  secondary: >-
                    {{ '%.1f' | format(states('sensor.huawei_esm_battery_system_pack_4_battery_voltage') | float(0)) }}V | {{ '%+.1f' | format(states('sensor.huawei_esm_battery_system_pack_4_current') | float(0)) }}A ({{ '%+.0f' | format(states('sensor.huawei_esm_battery_system_pack_4_battery_voltage')|float(0) * states('sensor.huawei_esm_battery_system_pack_4_current')|float(0)) }}W)
                  icon: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_4_current') | float(0) %}
                    {% if cur < -0.5 %}mdi:battery-arrow-down{% elif cur > 0.5 %}mdi:battery-arrow-up{% else %}mdi:battery{% endif %}
                  icon_color: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_4_current') | float(0) %}
                    {% if cur < -8 %}red{% elif cur < -1 %}orange{% elif cur > 1 %}green{% else %}blue{% endif %}
                  entity: sensor.huawei_esm_battery_system_pack_4_state_of_charge

              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.huawei_esm_battery_system_pack_5_monitor_enable
                    state: 'on'
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_5_state_of_charge
                    state_not: unavailable
                  - condition: state
                    entity: sensor.huawei_esm_battery_system_pack_5_state_of_charge
                    state_not: unknown
                card:
                  type: custom:mushroom-template-card
                  primary: >-
                    Pack 5: {{ states('sensor.huawei_esm_battery_system_pack_5_state_of_charge') }}%
                  secondary: >-
                    {{ '%.1f' | format(states('sensor.huawei_esm_battery_system_pack_5_battery_voltage') | float(0)) }}V | {{ '%+.1f' | format(states('sensor.huawei_esm_battery_system_pack_5_current') | float(0)) }}A ({{ '%+.0f' | format(states('sensor.huawei_esm_battery_system_pack_5_battery_voltage')|float(0) * states('sensor.huawei_esm_battery_system_pack_5_current')|float(0)) }}W)
                  icon: >-
                    {% set cur = states('sensor.huawei_esm_battery_system_pack_5_current') | float(0) %}
                    {% if cur < -0.5 %}mdi:battery-arrow-down{% elif cur > 0.5 %}mdi:battery-arrow-up{% else %}mdi:battery{% endif %}
