# ==============================================================================
# ESPHome Configuration for Project V2: LILYGO T-CAN485 (Inverter Bridge & Logger)
# Version: 2.0.0 Enterprise (CAN Interconnect + Pylontech Emulator V6 + SD Logger)
# ==============================================================================

esphome:
  name: tcan-inverter-bridge-v2
  friendly_name: "Inverter Bridge V2 & Logger"
  build_path: C:\esphome_build\tcan_inverter_bridge_v2
  platformio_options:
    build_flags:
      - "-mlongcalls"
  on_boot:
    priority: -10
    then:
      - light.turn_on:
          id: board_status_led
          red: 0.0
          green: 0.0
          blue: 1.0
          brightness: 100%
          transition_length: 0s
      - delay: 1000ms
      - light.turn_off:
          id: board_status_led
          transition_length: 0s

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      CONFIG_FATFS_VOLUME_COUNT: "2"
    advanced:
      include_builtin_idf_components:
        - fatfs
        - wear_levelling
        - sdmmc

wifi:
  ssid: "Home_Ball"
  password: "99999999"
  manual_ip:
    static_ip: 192.168.8.109
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1
    dns2: 8.8.8.8
  power_save_mode: NONE
  ap:
    ssid: "tcan-bridge-v2-ap"
    password: "bms_setup_password"

captive_portal:

web_server:
  port: 80

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

logger:
  level: WARN
  baud_rate: 0

external_components:
  - source:
      type: local
      path: components

# ------------------------------------------------------------------------------
# 1. CAN-Bus (TWAI 500kbps) Interconnect: รับข้อมูลจาก Board 1 (192.168.8.108)
# ------------------------------------------------------------------------------
canbus:
  - platform: esp32_can
    id: interconnect_can_bus
    tx_pin: GPIO27
    rx_pin: GPIO26
    can_id: 1
    bit_rate: 500kbps
    on_frame:
      # Frame 0x355: SOC & SOH
      - can_id: 0x355
        then:
          - lambda: |-
              if (x.size() >= 4) {
                uint16_t soc = x[0] | (x[1] << 8);
                uint16_t soh = x[2] | (x[3] << 8);
                id(can_battery_soc).publish_state(soc);
                id(can_battery_soh).publish_state(soh);
              }
      # Frame 0x356: Voltage (0.01V), Current (0.1A signed), Temp (0.1°C signed)
      - can_id: 0x356
        then:
          - lambda: |-
              if (x.size() >= 6) {
                int16_t v_raw = (int16_t)(x[0] | (x[1] << 8));
                int16_t i_raw = (int16_t)(x[2] | (x[3] << 8));
                int16_t t_raw = (int16_t)(x[4] | (x[5] << 8));
                float v = (float)v_raw * 0.01f;
                float i = (float)i_raw * 0.1f;
                float t = (float)t_raw * 0.1f;
                id(can_battery_voltage).publish_state(v);
                id(can_battery_current).publish_state(i);
                id(can_battery_temp).publish_state(t);
                id(can_battery_power).publish_state(v * i);
              }

# ------------------------------------------------------------------------------
# 2. UART & Pylontech Emulator (Dedicated Isolated Module on GPIO 33/32 -> Inverter)
# ------------------------------------------------------------------------------
uart:
  - id: uart_inverter_pylon
    tx_pin: GPIO33
    rx_pin:
      number: GPIO32
      mode: INPUT_PULLUP
    baud_rate: 9600
    rx_buffer_size: 512

pylontech_emulator:
  id: pylon_emu
  uart_id: uart_inverter_pylon
  soc_sensor: can_battery_soc
  voltage_sensor: can_battery_voltage
  current_sensor: can_battery_current
  temp_sensor: can_battery_temp
  query_count_sensor: inverter_query_count

# ------------------------------------------------------------------------------
# 3. MicroSD Card Logger & Wi-Fi Download Server (Port 8080)
# ------------------------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - time.google.com

sd_logger:
  id: sd_card_logger
  time_id: sntp_time
  update_interval: 10s
  cs_pin: 13
  mosi_pin: 15
  miso_pin: 2
  clk_pin: 14
  http_port: 8080
  voltage_sensor: can_battery_voltage
  current_sensor: can_battery_current
  power_sensor: can_battery_power
  soc_sensor: can_battery_soc
  temp_sensor: can_battery_temp
  pack1_soc: can_battery_soc
  pack1_v: can_battery_voltage
  pack1_i: can_battery_current
  pack2_soc: can_battery_soc
  pack2_v: can_battery_voltage
  pack2_i: can_battery_current
  pack3_soc: can_battery_soc
  pack3_v: can_battery_voltage
  pack3_i: can_battery_current
  pack4_soc: can_battery_soc
  pack4_v: can_battery_voltage
  pack4_i: can_battery_current
  inverter_queries: inverter_query_count

# ------------------------------------------------------------------------------
# 4. Status LED (WS2812 RGB LED on GPIO 4)
# ------------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO04
    num_leds: 1
    name: "Bridge Status LED"
    id: board_status_led
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

# ------------------------------------------------------------------------------
# 5. Sensors (Replicated from CAN Bus)
# ------------------------------------------------------------------------------
sensor:
  - platform: template
    name: "System Voltage (from CAN)"
    id: can_battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement

  - platform: template
    name: "System Current (from CAN)"
    id: can_battery_current
    unit_of_measurement: "A"
    accuracy_decimals: 2
    device_class: current
    state_class: measurement

  - platform: template
    name: "System Power (from CAN)"
    id: can_battery_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: template
    name: "System SOC (from CAN)"
    id: can_battery_soc
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement

  - platform: template
    name: "System SOH (from CAN)"
    id: can_battery_soh
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement

  - platform: template
    name: "Max Battery Temp (from CAN)"
    id: can_battery_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: template
    name: "Inverter Queries Count"
    id: inverter_query_count
    unit_of_measurement: "queries"
    accuracy_decimals: 0
    icon: "mdi:counter"
    state_class: total_increasing

  - platform: template
    name: "Bridge ESP32 Free Heap"
    id: bridge_free_heap
    unit_of_measurement: "B"
    accuracy_decimals: 0
    icon: "mdi:memory"
    lambda: |-
      return (float)esp_get_free_heap_size();
    update_interval: 10s
