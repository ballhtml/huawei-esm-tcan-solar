# ------------------------------------------------------------------------------
# Time-Division Multiplexing Polling Engine + Activity Blink Script
# ------------------------------------------------------------------------------
script:
  - id: flash_activity_led
    mode: restart
    then:
      - light.turn_on:
          id: board_status_led
          red: 0.0
          green: 1.0
          blue: 0.0
          brightness: 100%
          transition_length: 0s
      - delay: 80ms
      - light.turn_off:
          id: board_status_led
          transition_length: 0s

  - id: modbus_polling_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - if:
                condition:
                  lambda: 'return id(pack1_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack1).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack2_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack2).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack3_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack3).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack4_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack4).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack5_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack5).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack6_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack6).update();'
                  - script.execute: flash_activity_led
                  - delay: 5000ms
            - if:
                condition:
                  lambda: 'return id(pack7_monitor).state;'
                then:
                  - lambda: 'id(huawei_esm_pack7).update();'
                  - script.execute: flash_activity_led
            - delay: 1000ms

  # --- ESN/BarCode Reader for Pack 4 (Isolated Bus on uart_pack4, Slave ID 0xD6) ---
  - id: read_esn_pack4
    mode: single
    then:
      - script.stop: modbus_polling_loop
      - delay: 2000ms
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 4 (0xD6 on uart_pack4) ==="
      # Step 1: UploadStartCommand
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x05, 0x01, 0x04, 0x69, 0xBC]
      - delay: 1000ms
      # Step 2: UploadDataCommand Block 0
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x6A, 0x59]
      - delay: 1000ms
      # Step 3: UploadDataCommand Block 1
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0xAB, 0x99]
      - delay: 1000ms
      # Step 4: UploadDataFinish
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x0C, 0x01, 0x04, 0xB9, 0xBE]
      - delay: 1500ms
      - logger.log:
          level: WARN
          format: ">>> ESN READ: Pack 4 read complete!"
      - script.execute: modbus_polling_loop

  # --- ESN/BarCode Reader for ALL Packs ---
  - id: read_esn_all
    mode: single
    then:
      - script.stop: modbus_polling_loop
      - delay: 2000ms
      # ==================== PACK 4 (uart_pack4, 0xD6) ====================
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 4 (0xD6 on uart_pack4) ==="
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x05, 0x01, 0x04, 0x69, 0xBC]
      - delay: 1000ms
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x6A, 0x59]
      - delay: 1000ms
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0xAB, 0x99]
      - delay: 1000ms
      - uart.write:
          id: uart_pack4
          data: [0xD6, 0x41, 0x0C, 0x01, 0x04, 0xB9, 0xBE]
      - delay: 1500ms
      # ==================== PACK 1 (uart_bms, 0xD6) ====================
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 1 (0xD6 on uart_bms) ==="
      - uart.write:
          id: uart_bms
          data: [0xD6, 0x41, 0x05, 0x01, 0x04, 0x69, 0xBC]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x6A, 0x59]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD6, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0xAB, 0x99]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD6, 0x41, 0x0C, 0x01, 0x04, 0xB9, 0xBE]
      - delay: 1500ms
      # ==================== PACK 2 (uart_bms, 0xD7) ====================
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 2 (0xD7 on uart_bms) ==="
      - uart.write:
          id: uart_bms
          data: [0xD7, 0x41, 0x05, 0x01, 0x04, 0x54, 0x7C]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD7, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x7A, 0x99]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD7, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0xBB, 0x59]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD7, 0x41, 0x0C, 0x01, 0x04, 0x84, 0x7E]
      - delay: 1500ms
      # ==================== PACK 3 (uart_bms, 0xD8) ====================
      - logger.log:
          level: WARN
          format: ">>> ESN READ: === PACK 3 (0xD8 on uart_bms) ==="
      - uart.write:
          id: uart_bms
          data: [0xD8, 0x41, 0x05, 0x01, 0x04, 0x00, 0x7D]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD8, 0x41, 0x06, 0x03, 0x04, 0x00, 0x00, 0x85, 0x99]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD8, 0x41, 0x06, 0x03, 0x04, 0x00, 0x01, 0x44, 0x59]
      - delay: 1000ms
      - uart.write:
          id: uart_bms
          data: [0xD8, 0x41, 0x0C, 0x01, 0x04, 0xD0, 0x7F]
      - delay: 1500ms
      - logger.log:
          level: WARN
          format: ">>> ESN READ: All packs read complete!"
      - script.execute: modbus_polling_loop

