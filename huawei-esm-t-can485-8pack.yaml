  # ==================== Individual Pack Remaining Capacities ====================
  - platform: template
    name: "Pack 1 Remaining Capacity"
    id: pack1_remaining_capacity
    unit_of_measurement: "Ah"
    accuracy_decimals: 1
    icon: "mdi:battery-plus"
    state_class: measurement
    update_interval: 2s
    lambda: |-
      if (id(pack1_monitor).state && !isnan(id(pack1_state_of_charge).state)) {
        float nom = (!isnan(id(pack1_nominal_capacity).state) && id(pack1_nominal_capacity).state > 10.0f) ? id(pack1_nominal_capacity).state : 100.0f;
        return (id(pack1_state_of_charge).state * nom) / 100.0f;
      }
      return NAN;

