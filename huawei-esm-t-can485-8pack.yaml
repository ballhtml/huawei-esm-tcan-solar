# ==============================================================================
# ESPHome Configuration for LILYGO T-CAN485 + Huawei ESM-48100B1 BMS (8-Pack Ready)
# Version: 6.3.0 Enterprise (Green Activity Pulse LED with Instant Transition)
# ==============================================================================

esphome:
  name: tcanesm
  friendly_name: "Huawei ESM Battery System"
  build_path: C:\esphome_build\tcanesm
  includes:
    - tcan_telemetry_shared.h
  platformio_options:
    build_flags:
      - "-mlongcalls"
  on_boot:
    priority: -10
    then:
      - switch.turn_on: rs485_power
      - switch.turn_off: rs485_chip_enable
      - switch.turn_off: rs485_autodirection
      - switch.turn_off: can_power
      - switch.turn_on: pack1_monitor
      - switch.turn_on: pack2_monitor
      - switch.turn_on: pack3_monitor
      - switch.turn_on: pack4_monitor
      - switch.turn_on: pack5_monitor
      - switch.turn_on: pack6_monitor
      - switch.turn_on: pack7_monitor
      - switch.turn_on: pack8_monitor
      - lambda: |-
          struct ModbusAccessor : public esphome::modbus::Modbus {
            void set_delays(uint16_t frame_delay, uint16_t long_delay) {
              this->frame_delay_ms_ = frame_delay;
              this->long_rx_buffer_delay_ms_ = long_delay;
            }
          };
          static_cast<ModbusAccessor *>(modbus_bms)->set_delays(250, 350);
          static_cast<ModbusAccessor *>(modbus_pack4)->set_delays(250, 350);
          ESP_LOGI("bms_init", "Modbus frame_delay set to 250ms, long_rx_delay set to 350ms for both buses");
      - light.turn_on:
          id: board_status_led
          red: 0.0
          green: 1.0
          blue: 0.0
          brightness: 100%
          transition_length: 0s
      - delay: 1000ms
      - light.turn_off:
          id: board_status_led
          transition_length: 0s
      - script.execute: modbus_polling_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  manual_ip:
    static_ip: 192.168.8.108
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1
    dns2: 8.8.8.8
  power_save_mode: NONE
  ap:
    ssid: "tcanesm-ap"
    password: "bms_setup_password"

captive_portal:

web_server:
  port: 80

# Native Home Assistant API - Instant Auto-Discovery in Home Assistant
api:
  reboot_timeout: 0s

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: components_v4

logger:
  level: DEBUG
  baud_rate: 0

# ------------------------------------------------------------------------------
# UART & Modbus Configuration (Isolated Port 1 - Hardware FIFO & Input Pullup)
# ------------------------------------------------------------------------------
uart:
  # Port 1 (External Isolated Module on GPIO32/33) Connected to Battery Packs 1, 2, 3
  - id: uart_bms
    tx_pin: GPIO33
    rx_pin:
      number: GPIO32
      mode: INPUT_PULLUP
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    rx_timeout: 90
    rx_buffer_size: 512

  # Port 2 (External Isolated Module on GPIO18/25) for Pack 4 (Isolated Bus)
  - id: uart_pack4
    tx_pin: GPIO18
    rx_pin:
      number: GPIO25
      mode: INPUT_PULLUP
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    rx_timeout: 90
    rx_buffer_size: 512



# ------------------------------------------------------------------------------
# CAN-Bus (TWAI 500kbps) Transmitter: ส่งข้อมูล Battery System ไปหา Board 2
# ------------------------------------------------------------------------------
canbus:
  - platform: esp32_can
    id: interconnect_can_bus
    tx_pin: GPIO27
    rx_pin: GPIO26
    can_id: 0
    bit_rate: 500kbps
    on_frame:
      # Frame 0x358: Pack 8 Summary Telemetry from Board 2 (192.168.8.109)
      - can_id: 0x358
        then:
          - lambda: |-
              if (x.size() >= 8) {
                uint16_t v_raw = x[0] | (x[1] << 8);
                int16_t i_raw = (int16_t)(x[2] | (x[3] << 8));
                uint8_t soc = x[4];
                uint8_t soh = x[5];
                int16_t t_raw = (int16_t)(x[6] | (x[7] << 8));
                float v = (float)v_raw * 0.01f;
                float i = (float)i_raw * 0.01f;
                float temp = (float)t_raw * 0.1f;

                if (v > 20.0f && v < 65.0f) {
                  mark_pack_rx_fresh(7);
                }

                id(pack8_battery_voltage).publish_state(v);
                id(pack8_busbar_voltage).publish_state(v);
                id(pack8_current).publish_state(i);
                id(pack8_state_of_charge).publish_state(soc);
                id(pack8_state_of_health).publish_state(soh);
                id(pack8_max_cell_temp).publish_state(temp);
                if (isnan(id(pack8_min_cell_temp).state)) {
                  id(pack8_min_cell_temp).publish_state(temp);
                }
                id(pack8_nominal_capacity).publish_state(100.0f);
                id(pack8_bms_operating_mode).publish_state(2);

                // Only seed fallback cell voltages if real cell frames (0x359..0x35C) have not arrived yet
                if (isnan(id(pack8_cell_01_voltage).state)) {
                  float cell_v = v / 15.0f;
                  id(pack8_cell_01_voltage).publish_state(cell_v);
                  id(pack8_cell_02_voltage).publish_state(cell_v);
                  id(pack8_cell_03_voltage).publish_state(cell_v);
                  id(pack8_cell_04_voltage).publish_state(cell_v);
                  id(pack8_cell_05_voltage).publish_state(cell_v);
                  id(pack8_cell_06_voltage).publish_state(cell_v);
                  id(pack8_cell_07_voltage).publish_state(cell_v);
                  id(pack8_cell_08_voltage).publish_state(cell_v);
                  id(pack8_cell_09_voltage).publish_state(cell_v);
                  id(pack8_cell_10_voltage).publish_state(cell_v);
                  id(pack8_cell_11_voltage).publish_state(cell_v);
                  id(pack8_cell_12_voltage).publish_state(cell_v);
                  id(pack8_cell_13_voltage).publish_state(cell_v);
                  id(pack8_cell_14_voltage).publish_state(cell_v);
                  id(pack8_cell_15_voltage).publish_state(cell_v);
                }

                if (!id(pack8_monitor).state) {
                  id(pack8_monitor).publish_state(true);
                }
                ESP_LOGD("can_rx_pack8", "Received Pack 8: V=%.2fV I=%.2fA SOC=%u%% Temp=%.1fC", v, i, soc, temp);
              }
      # Frames 0x359..0x35C: Pack 8 Real Individual Cell Voltages (Cells 1..15) + Min Temp from Board 109
      - can_id: 0x359
        then:
          - lambda: |-
              if (x.size() >= 8) {
                uint16_t c1 = x[0] | (x[1] << 8), c2 = x[2] | (x[3] << 8), c3 = x[4] | (x[5] << 8), c4 = x[6] | (x[7] << 8);
                if (c1 > 1500 && c1 < 4500) id(pack8_cell_01_voltage).publish_state(c1 * 0.001f);
                if (c2 > 1500 && c2 < 4500) id(pack8_cell_02_voltage).publish_state(c2 * 0.001f);
                if (c3 > 1500 && c3 < 4500) id(pack8_cell_03_voltage).publish_state(c3 * 0.001f);
                if (c4 > 1500 && c4 < 4500) id(pack8_cell_04_voltage).publish_state(c4 * 0.001f);
              }
      - can_id: 0x35A
        then:
          - lambda: |-
              if (x.size() >= 8) {
                uint16_t c5 = x[0] | (x[1] << 8), c6 = x[2] | (x[3] << 8), c7 = x[4] | (x[5] << 8), c8 = x[6] | (x[7] << 8);
                if (c5 > 1500 && c5 < 4500) id(pack8_cell_05_voltage).publish_state(c5 * 0.001f);
                if (c6 > 1500 && c6 < 4500) id(pack8_cell_06_voltage).publish_state(c6 * 0.001f);
                if (c7 > 1500 && c7 < 4500) id(pack8_cell_07_voltage).publish_state(c7 * 0.001f);
                if (c8 > 1500 && c8 < 4500) id(pack8_cell_08_voltage).publish_state(c8 * 0.001f);
              }
      - can_id: 0x35B
        then:
          - lambda: |-
              if (x.size() >= 8) {
                uint16_t c9 = x[0] | (x[1] << 8), c10 = x[2] | (x[3] << 8), c11 = x[4] | (x[5] << 8), c12 = x[6] | (x[7] << 8);
                if (c9 > 1500 && c9 < 4500) id(pack8_cell_09_voltage).publish_state(c9 * 0.001f);
                if (c10 > 1500 && c10 < 4500) id(pack8_cell_10_voltage).publish_state(c10 * 0.001f);
                if (c11 > 1500 && c11 < 4500) id(pack8_cell_11_voltage).publish_state(c11 * 0.001f);
                if (c12 > 1500 && c12 < 4500) id(pack8_cell_12_voltage).publish_state(c12 * 0.001f);
              }
      - can_id: 0x35C
        then:
          - lambda: |-
              if (x.size() >= 8) {
                uint16_t c13 = x[0] | (x[1] << 8), c14 = x[2] | (x[3] << 8), c15 = x[4] | (x[5] << 8);
                int16_t tmin_raw = (int16_t)(x[6] | (x[7] << 8));
                if (c13 > 1500 && c13 < 4500) id(pack8_cell_13_voltage).publish_state(c13 * 0.001f);
                if (c14 > 1500 && c14 < 4500) id(pack8_cell_14_voltage).publish_state(c14 * 0.001f);
                if (c15 > 1500 && c15 < 4500) id(pack8_cell_15_voltage).publish_state(c15 * 0.001f);
                if (tmin_raw > -400 && tmin_raw < 1000) id(pack8_min_cell_temp).publish_state(tmin_raw * 0.1f);
              }

interval:
  - interval: 2000ms
    then:
      - lambda: |-
          float soc = id(total_battery_system_soc).state;
          float v = id(total_battery_system_voltage).state;
          float i = id(total_battery_system_current).state;
          float temp = id(max_battery_cell_temp).state;

          // Auto-recover TWAI controller if it entered Bus-Off state during boot/hot-plug
          twai_status_info_t status_info;
          if (twai_get_status_info(&status_info) == ESP_OK) {
            static uint32_t diag_cnt = 0;
            if ((++diag_cnt % 5) == 0) {
              ESP_LOGI("can_diag", "TWAI state=%d msgs_tx=%lu tec=%lu rec=%lu arb_lost=%lu bus_err=%lu",
                       (int)status_info.state, (unsigned long)status_info.msgs_to_tx,
                       (unsigned long)status_info.tx_error_counter, (unsigned long)status_info.rx_error_counter,
                       (unsigned long)status_info.arb_lost_count, (unsigned long)status_info.bus_error_count);
            }
            if (status_info.state == TWAI_STATE_BUS_OFF) {
              ESP_LOGW("can_diag", "TWAI in BUS_OFF (TEC=%lu, REC=%lu), initiating recovery...",
                       (unsigned long)status_info.tx_error_counter, (unsigned long)status_info.rx_error_counter);
              twai_initiate_recovery();
            } else if (status_info.state == TWAI_STATE_STOPPED) {
              ESP_LOGI("can_diag", "TWAI STOPPED after recovery, restarting twai_start()...");
              twai_start();
            } else if (status_info.msgs_to_tx >= 5) {
              ESP_LOGW("can_diag", "TWAI TX queue full (msgs_tx=%lu, tec=%lu, rec=%lu), clearing TX queue...",
                       (unsigned long)status_info.msgs_to_tx,
                       (unsigned long)status_info.tx_error_counter, (unsigned long)status_info.rx_error_counter);
              twai_clear_transmit_queue();
            }
          }

          esphome::switch_::Switch* p_mon[8] = {
            id(pack1_monitor), id(pack2_monitor), id(pack3_monitor), id(pack4_monitor),
            id(pack5_monitor), id(pack6_monitor), id(pack7_monitor), id(pack8_monitor)
          };
          esphome::sensor::Sensor* p_v[8] = {
            id(pack1_battery_voltage), id(pack2_battery_voltage), id(pack3_battery_voltage), id(pack4_battery_voltage),
            id(pack5_battery_voltage), id(pack6_battery_voltage), id(pack7_battery_voltage), id(pack8_battery_voltage)
          };
          esphome::sensor::Sensor* p_i[8] = {
            id(pack1_current), id(pack2_current), id(pack3_current), id(pack4_current),
            id(pack5_current), id(pack6_current), id(pack7_current), id(pack8_current)
          };
          esphome::sensor::Sensor* p_soc[8] = {
            id(pack1_state_of_charge), id(pack2_state_of_charge), id(pack3_state_of_charge), id(pack4_state_of_charge),
            id(pack5_state_of_charge), id(pack6_state_of_charge), id(pack7_state_of_charge), id(pack8_state_of_charge)
          };
          esphome::sensor::Sensor* p_t[8] = {
            id(pack1_max_cell_temp), id(pack2_max_cell_temp), id(pack3_max_cell_temp), id(pack4_max_cell_temp),
            id(pack5_max_cell_temp), id(pack6_max_cell_temp), id(pack7_max_cell_temp), id(pack8_max_cell_temp)
          };
          esphome::sensor::Sensor* p_c[8][15] = {
            {id(pack1_cell_01_voltage), id(pack1_cell_02_voltage), id(pack1_cell_03_voltage), id(pack1_cell_04_voltage), id(pack1_cell_05_voltage), id(pack1_cell_06_voltage), id(pack1_cell_07_voltage), id(pack1_cell_08_voltage), id(pack1_cell_09_voltage), id(pack1_cell_10_voltage), id(pack1_cell_11_voltage), id(pack1_cell_12_voltage), id(pack1_cell_13_voltage), id(pack1_cell_14_voltage), id(pack1_cell_15_voltage)},
            {id(pack2_cell_01_voltage), id(pack2_cell_02_voltage), id(pack2_cell_03_voltage), id(pack2_cell_04_voltage), id(pack2_cell_05_voltage), id(pack2_cell_06_voltage), id(pack2_cell_07_voltage), id(pack2_cell_08_voltage), id(pack2_cell_09_voltage), id(pack2_cell_10_voltage), id(pack2_cell_11_voltage), id(pack2_cell_12_voltage), id(pack2_cell_13_voltage), id(pack2_cell_14_voltage), id(pack2_cell_15_voltage)},
            {id(pack3_cell_01_voltage), id(pack3_cell_02_voltage), id(pack3_cell_03_voltage), id(pack3_cell_04_voltage), id(pack3_cell_05_voltage), id(pack3_cell_06_voltage), id(pack3_cell_07_voltage), id(pack3_cell_08_voltage), id(pack3_cell_09_voltage), id(pack3_cell_10_voltage), id(pack3_cell_11_voltage), id(pack3_cell_12_voltage), id(pack3_cell_13_voltage), id(pack3_cell_14_voltage), id(pack3_cell_15_voltage)},
            {id(pack4_cell_01_voltage), id(pack4_cell_02_voltage), id(pack4_cell_03_voltage), id(pack4_cell_04_voltage), id(pack4_cell_05_voltage), id(pack4_cell_06_voltage), id(pack4_cell_07_voltage), id(pack4_cell_08_voltage), id(pack4_cell_09_voltage), id(pack4_cell_10_voltage), id(pack4_cell_11_voltage), id(pack4_cell_12_voltage), id(pack4_cell_13_voltage), id(pack4_cell_14_voltage), id(pack4_cell_15_voltage)},
            {id(pack5_cell_01_voltage), id(pack5_cell_02_voltage), id(pack5_cell_03_voltage), id(pack5_cell_04_voltage), id(pack5_cell_05_voltage), id(pack5_cell_06_voltage), id(pack5_cell_07_voltage), id(pack5_cell_08_voltage), id(pack5_cell_09_voltage), id(pack5_cell_10_voltage), id(pack5_cell_11_voltage), id(pack5_cell_12_voltage), id(pack5_cell_13_voltage), id(pack5_cell_14_voltage), id(pack5_cell_15_voltage)},
            {id(pack6_cell_01_voltage), id(pack6_cell_02_voltage), id(pack6_cell_03_voltage), id(pack6_cell_04_voltage), id(pack6_cell_05_voltage), id(pack6_cell_06_voltage), id(pack6_cell_07_voltage), id(pack6_cell_08_voltage), id(pack6_cell_09_voltage), id(pack6_cell_10_voltage), id(pack6_cell_11_voltage), id(pack6_cell_12_voltage), id(pack6_cell_13_voltage), id(pack6_cell_14_voltage), id(pack6_cell_15_voltage)},
            {id(pack7_cell_01_voltage), id(pack7_cell_02_voltage), id(pack7_cell_03_voltage), id(pack7_cell_04_voltage), id(pack7_cell_05_voltage), id(pack7_cell_06_voltage), id(pack7_cell_07_voltage), id(pack7_cell_08_voltage), id(pack7_cell_09_voltage), id(pack7_cell_10_voltage), id(pack7_cell_11_voltage), id(pack7_cell_12_voltage), id(pack7_cell_13_voltage), id(pack7_cell_14_voltage), id(pack7_cell_15_voltage)},
            {id(pack8_cell_01_voltage), id(pack8_cell_02_voltage), id(pack8_cell_03_voltage), id(pack8_cell_04_voltage), id(pack8_cell_05_voltage), id(pack8_cell_06_voltage), id(pack8_cell_07_voltage), id(pack8_cell_08_voltage), id(pack8_cell_09_voltage), id(pack8_cell_10_voltage), id(pack8_cell_11_voltage), id(pack8_cell_12_voltage), id(pack8_cell_13_voltage), id(pack8_cell_14_voltage), id(pack8_cell_15_voltage)}
          };

          // Evaluate live fresh packs and find both True Bank Averages & Worst-Pack Safety Floors
          float min_soc = 100.0f;
          float min_v = 100.0f;
          uint16_t min_cell_mv = 9999;
          float sum_soc = 0.0f;
          float sum_v = 0.0f;
          int active_soc_packs = 0;
          int active_v_packs = 0;

          for (int idx = 0; idx < 8; idx++) {
            uint32_t max_age = (idx == 7) ? 30000 : 90000;
            if (!p_mon[idx]->state || !is_pack_fresh(idx, max_age)) continue;

            float psoc = p_soc[idx]->state;
            float pv = p_v[idx]->state;
            if (std::isfinite(psoc) && psoc >= 0.0f && psoc <= 100.0f) {
              if (psoc < min_soc) min_soc = psoc;
              sum_soc += psoc;
              active_soc_packs++;
            }
            if (std::isfinite(pv) && pv > 20.0f && pv < 65.0f) {
              if (pv < min_v) min_v = pv;
              sum_v += pv;
              active_v_packs++;
            }
            for (int c = 0; c < 15; c++) {
              float cv = p_c[idx][c]->state;
              if (std::isfinite(cv) && cv > 1.5f && cv < 4.5f) {
                uint16_t cmv = (uint16_t)(cv * 1000.0f + 0.5f);
                if (cmv < min_cell_mv) min_cell_mv = cmv;
              }
            }
          }

          // CRITICAL SAFETY GUARD: If zero packs have fresh Modbus/CAN telemetry, do NOT ping Board 109!
          // This guarantees Board 109's 15s watchdog trips and switches Inverter to Grid if BMS bus freezes.
          if (active_v_packs == 0 && active_soc_packs == 0) {
            ESP_LOGW("bms_watchdog", "No fresh battery packs online! Suppressing CAN/UDP ping to Inverter Bridge.");
            return;
          }

          if (isnan(soc) || isnan(v) || isnan(i) || isnan(temp)) return;

          float avg_soc = (active_soc_packs > 0) ? (sum_soc / active_soc_packs) : soc;
          float avg_v = (active_v_packs > 0) ? (sum_v / active_v_packs) : v;

          // True Bank Capacity Algorithm with Top-of-Charge Balancing & Emergency Pack Floor:
          // - Normal / Discharging: Report True Bank Average SOC (avg_soc) so all displays match actual bank energy.
          // - Top-of-Charge (i > 1.5A and avg_soc >= 96%): Hold reported SOC at min_soc (capped <= 99%) until slowest pack reaches 99%+.
          float target_soc = avg_soc;
          if (i > 1.5f && avg_soc >= 96.0f && min_soc < 99.0f) {
            target_soc = std::min(avg_soc, std::max(min_soc, 95.0f));
          }

          // Report True Bank Average Voltage normally; override with min_v only if any pack hits <= 46.5V emergency floor
          float target_v = (min_v <= 46.5f) ? min_v : avg_v;
          uint16_t min_v_100 = (min_v < 90.0f) ? (uint16_t)(min_v * 100.0f) : (uint16_t)(target_v * 100.0f);
          uint16_t send_min_cell = (min_cell_mv < 9000) ? min_cell_mv : 0;

          // 0x355: SOC & SOH
          uint16_t soc_val = (uint16_t)(target_soc + 0.5f);
          uint16_t soh_val = 100;
          std::vector<uint8_t> d355 = {
            (uint8_t)(soc_val & 0xFF), (uint8_t)((soc_val >> 8) & 0xFF),
            (uint8_t)(soh_val & 0xFF), (uint8_t)((soh_val >> 8) & 0xFF)
          };
          id(interconnect_can_bus).send_data(0x355, false, d355);

          // 0x356: Voltage (0.01V), Current (0.1A signed), Temp (0.1°C signed), MinPackV (0.01V)
          int16_t v_100 = (int16_t)(target_v * 100.0f);
          int16_t i_10 = (int16_t)(i * 10.0f);
          int16_t t_10 = (int16_t)(temp * 10.0f);
          std::vector<uint8_t> d356 = {
            (uint8_t)(v_100 & 0xFF), (uint8_t)((v_100 >> 8) & 0xFF),
            (uint8_t)(i_10 & 0xFF), (uint8_t)((i_10 >> 8) & 0xFF),
            (uint8_t)(t_10 & 0xFF), (uint8_t)((t_10 >> 8) & 0xFF),
            (uint8_t)(min_v_100 & 0xFF), (uint8_t)((min_v_100 >> 8) & 0xFF)
          };
          id(interconnect_can_bus).send_data(0x356, false, d356);

          // Dual-Path Redundant UDP Broadcast to Board 109 (Persistent socket - Zero leak)
          static int s_udp_109 = -1;
          if (s_udp_109 < 0) {
            s_udp_109 = ::socket(AF_INET, SOCK_DGRAM, IPPROTO_IP);
            if (s_udp_109 >= 0) {
              int flags = ::fcntl(s_udp_109, F_GETFL, 0);
              ::fcntl(s_udp_109, F_SETFL, flags | O_NONBLOCK);
            }
          }
          if (s_udp_109 >= 0) {
            struct sockaddr_in dest_addr = {};
            dest_addr.sin_family = AF_INET;
            dest_addr.sin_port = htons(18888);
            dest_addr.sin_addr.s_addr = inet_addr("192.168.8.109");
            uint8_t pkt[16] = {
              0xAA, 0x55,
              (uint8_t)(soc_val & 0xFF), (uint8_t)((soc_val >> 8) & 0xFF),
              (uint8_t)(soh_val & 0xFF), (uint8_t)((soh_val >> 8) & 0xFF),
              (uint8_t)(v_100 & 0xFF), (uint8_t)((v_100 >> 8) & 0xFF),
              (uint8_t)(i_10 & 0xFF), (uint8_t)((i_10 >> 8) & 0xFF),
              (uint8_t)(t_10 & 0xFF), (uint8_t)((t_10 >> 8) & 0xFF),
              (uint8_t)(min_v_100 & 0xFF), (uint8_t)((min_v_100 >> 8) & 0xFF),
              (uint8_t)(send_min_cell & 0xFF), (uint8_t)((send_min_cell >> 8) & 0xFF)
            };
            ::sendto(s_udp_109, pkt, sizeof(pkt), 0, (struct sockaddr *)&dest_addr, sizeof(dest_addr));
          }

          // Direct UDP Telemetry Broadcast to CYD Display (192.168.8.110:5005) & Board 109
          static uint8_t s_seq = 0;
          TcanTelemetryPacket cyd_pkt;
          memset(&cyd_pkt, 0, sizeof(cyd_pkt));
          cyd_pkt.magic = TCAN_MAGIC;
          cyd_pkt.seq = s_seq++;
          cyd_pkt.sys_soc_x10 = (int16_t)(avg_soc * 10.0f);
          cyd_pkt.sys_v_x100 = (int16_t)(avg_v * 100.0f);
          cyd_pkt.sys_i_x10 = i_10;
          cyd_pkt.max_temp_x10 = t_10;

          for (int k = 0; k < 8; k++) {
            uint32_t max_age = (k == 7) ? 30000 : 90000;
            bool fresh = p_mon[k]->state && is_pack_fresh(k, max_age);
            float pv = p_v[k]->state;
            float pi = p_i[k]->state;
            float psoc = p_soc[k]->state;
            float pt = p_t[k]->state;
            bool online = fresh && ((std::isfinite(pv) && pv > 20.0f) || (std::isfinite(psoc) && psoc >= 0.0f));
            cyd_pkt.packs[k].is_online = online ? 1 : 0;
            if (online) {
              cyd_pkt.packs[k].voltage_x100 = (int16_t)(pv * 100.0f);
              cyd_pkt.packs[k].current_x10 = (int16_t)(pi * 10.0f);
              cyd_pkt.packs[k].soc_x10 = (int16_t)(psoc * 10.0f);
              cyd_pkt.packs[k].temp_x10 = (int16_t)(pt * 10.0f);
              float cmin = 999.0f, cmax = -999.0f;
              int valid_c = 0;
              for (int c = 0; c < 15; c++) {
                float cv = p_c[k][c]->state;
                if (std::isfinite(cv) && cv > 1.5f && cv < 4.5f) {
                  if (cv < cmin) cmin = cv;
                  if (cv > cmax) cmax = cv;
                  cyd_pkt.packs[k].cells_mv[c] = (uint16_t)(cv * 1000.0f + 0.5f);
                  valid_c++;
                } else {
                  cyd_pkt.packs[k].cells_mv[c] = 0;
                }
              }
              if (valid_c >= 10) {
                cyd_pkt.packs[k].delta_mv = (int16_t)((cmax - cmin) * 1000.0f);
              } else {
                cyd_pkt.packs[k].delta_mv = 0;
              }
            }
          }
          tcan_broadcast_telemetry(cyd_pkt);

